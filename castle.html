<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор замка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e2f;  /* тёмный, но спокойный фон */
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 400px; /* удобно для одной руки */
            margin: 0 auto;
        }

        /* Поля ввода — сразу видимые, без лишних обёрток */
        .inputs {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .input-row {
            display: flex;
            align-items: center;
            background: #2a2a3a;
            border-radius: 16px;
            padding: 4px 16px;
            border: 1px solid #3a3a4e;
        }

        .input-icon {
            font-size: 1.8rem;
            width: 48px;
            text-align: center;
            opacity: 0.9;
        }

        .input-row input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.4rem;
            padding: 16px 0;
            outline: none;
            text-align: right;
            font-weight: 500;
        }

        .input-row input::placeholder {
            color: #5a5a70;
        }

        /* Блок результатов — только цифры */
        .results {
            background: #2a2a3a;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #3a3a4e;
            display: none;
        }

        .results.active {
            display: block;
        }

        .level-block {
            text-align: center;
            margin-bottom: 28px;
        }

        .level-number {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            color: #b0ffb0;  /* мягкий зелёный */
            text-shadow: 0 0 8px rgba(176, 255, 176, 0.3);
        }

        .level-label {
            font-size: 1rem;
            color: #aaa;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .exchange-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .exchange-item {
            background: #1e1e2f;
            border-radius: 18px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #3a3a50;
        }

        .exchange-label {
            font-size: 1rem;
            color: #b0b0d0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exchange-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffd966;  /* мягкий жёлтый для акцента */
            cursor: pointer;
            transition: opacity 0.2s;
            padding: 5px 10px;
            border-radius: 12px;
            background: #2a2a40;
            user-select: all; /* легко выделить весь текст */
        }

        .exchange-value:active {
            opacity: 0.6;
            background: #3a3a55;
        }

        /* Всплывающее уведомление о копировании */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #4caf99;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }

        /* Мини-подпись курса, не навязчиво */
        .hint {
            color: #6a6a8b;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Только поля ввода, без лишних заголовков -->
        <div class="inputs">
            <div class="input-row">
                <span class="input-icon">🪨</span>
                <input type="number" id="stoneInput" placeholder="0" min="0" inputmode="decimal" autocomplete="off">
            </div>
            <div class="input-row">
                <span class="input-icon">🌲</span>
                <input type="number" id="woodInput" placeholder="0" min="0" inputmode="decimal" autocomplete="off">
            </div>
            <div class="input-row">
                <span class="input-icon">⚙️</span>
                <input type="number" id="metalInput" placeholder="0" min="0" inputmode="decimal" autocomplete="off">
            </div>
        </div>

        <!-- Результаты: только уровни и необходимые обмены -->
        <div class="results" id="results">
            <div class="level-block">
                <div class="level-number" id="maxLevelsBadge">0</div>
                <div class="level-label">уровней замка</div>
            </div>

            <div class="exchange-grid">
                <div class="exchange-item">
                    <span class="exchange-label">🪨→🌲</span>
                    <span class="exchange-value" id="stoneToWood" data-copy>0</span>
                </div>
                <div class="exchange-item">
                    <span class="exchange-label">🌲→⚙️</span>
                    <span class="exchange-value" id="woodToMetal" data-copy>0</span>
                </div>
            </div>
            <div class="hint">нажми на число, чтобы скопировать</div>
        </div>
    </div>

    <!-- Тост для уведомления о копировании -->
    <div id="toast" class="toast">Скопировано</div>

    <script>
        (function() {
            // --- Элементы DOM ---
            const stoneInput = document.getElementById('stoneInput');
            const woodInput = document.getElementById('woodInput');
            const metalInput = document.getElementById('metalInput');
            const resultsDiv = document.getElementById('results');

            // Элементы для вывода
            const maxLevelsSpan = document.getElementById('maxLevelsBadge');
            const stoneToWoodSpan = document.getElementById('stoneToWood');
            const woodToMetalSpan = document.getElementById('woodToMetal');

            // Константы
            const STONE_PER_LEVEL = 1260;
            const WOOD_PER_LEVEL = 340;
            const METAL_PER_LEVEL = 130;
            const STONE_TO_WOOD_RATE = 5;   // 1 дерево = 5 камня
            const WOOD_TO_METAL_RATE = 4;   // 1 металл = 4 дерева

            // Для debounce
            let calcTimeout = null;
            let lastStone = 0, lastWood = 0, lastMetal = 0;

            // --- Утилита копирования ---
            const toast = document.getElementById('toast');
            function showToast(text) {
                toast.textContent = text || 'Скопировано';
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1500);
            }

            // Обработчик клика на числах (копирование)
            document.querySelectorAll('[data-copy]').forEach(el => {
                el.addEventListener('click', (e) => {
                    const text = e.target.innerText;
                    if (text && text !== '0') {
                        navigator.clipboard?.writeText(text).then(() => {
                            showToast(`📋 ${text}`);
                        }).catch(() => {
                            // fallback
                            const range = document.createRange();
                            range.selectNode(e.target);
                            window.getSelection().removeAllRanges();
                            window.getSelection().addRange(range);
                            document.execCommand('copy');
                            showToast(`📋 ${text}`);
                        });
                    } else {
                        showToast('0');
                    }
                });
            });

            // --- Логика расчёта (без изменений, но убран лишний вывод) ---
            function calculateMaxLevels(stone, wood, metal) {
                let bestResult = null;
                for (let levels = 1; levels <= 10000; levels++) {
                    const result = simulateExchanges(stone, wood, metal, levels);
                    if (result.success) {
                        bestResult = result;
                    } else {
                        break;
                    }
                }
                return bestResult || {
                    levels: 0,
                    stoneToWood: 0,
                    woodToMetal: 0,
                    remainingStone: stone,
                    remainingWood: wood,
                    remainingMetal: metal
                };
            }

            function simulateExchanges(stone, wood, metal, levels) {
                const requiredStone = STONE_PER_LEVEL * levels;
                const requiredWood = WOOD_PER_LEVEL * levels;
                const requiredMetal = METAL_PER_LEVEL * levels;

                let curStone = stone, curWood = wood, curMetal = metal;
                let stoneToWood = 0, woodToMetal = 0;

                // 1. Металл
                if (curMetal < requiredMetal) {
                    const missingMetal = requiredMetal - curMetal;
                    const woodForMetal = missingMetal * WOOD_TO_METAL_RATE;
                    if (curWood >= woodForMetal) {
                        curWood -= woodForMetal;
                        curMetal += missingMetal;
                        woodToMetal += missingMetal;
                    } else {
                        const missingWood = woodForMetal - curWood;
                        const stoneForWood = missingWood * STONE_TO_WOOD_RATE;
                        if (curStone >= stoneForWood) {
                            curStone -= stoneForWood;
                            curWood += missingWood;
                            curWood -= woodForMetal;
                            curMetal += missingMetal;
                            stoneToWood += missingWood;
                            woodToMetal += missingMetal;
                        } else {
                            return { success: false };
                        }
                    }
                }

                // 2. Дерево
                if (curWood < requiredWood) {
                    const missingWood = requiredWood - curWood;
                    const stoneForWood = missingWood * STONE_TO_WOOD_RATE;
                    if (curStone >= stoneForWood) {
                        curStone -= stoneForWood;
                        curWood += missingWood;
                        stoneToWood += missingWood;
                    } else {
                        return { success: false };
                    }
                }

                // 3. Камень
                if (curStone < requiredStone) {
                    return { success: false };
                }

                // Вычитаем затраты
                curStone -= requiredStone;
                curWood -= requiredWood;
                curMetal -= requiredMetal;

                return {
                    success: true,
                    levels,
                    stoneToWood,
                    woodToMetal,
                };
            }

            function updateResults() {
                const stone = parseInt(stoneInput.value) || 0;
                const wood = parseInt(woodInput.value) || 0;
                const metal = parseInt(metalInput.value) || 0;

                if (stone === 0 && wood === 0 && metal === 0) {
                    resultsDiv.classList.remove('active');
                    return;
                }

                resultsDiv.classList.add('active');

                const result = calculateMaxLevels(stone, wood, metal);

                // Отображаем только нужные числа
                maxLevelsSpan.textContent = result.levels;
                stoneToWoodSpan.textContent = result.stoneToWood;
                woodToMetalSpan.textContent = result.woodToMetal;
            }

            // Debounce и обработчики
            function requestUpdate() {
                const stone = parseInt(stoneInput.value) || 0;
                const wood = parseInt(woodInput.value) || 0;
                const metal = parseInt(metalInput.value) || 0;

                if (stone === lastStone && wood === lastWood && metal === lastMetal) return;

                lastStone = stone;
                lastWood = wood;
                lastMetal = metal;

                if (calcTimeout) clearTimeout(calcTimeout);
                calcTimeout = setTimeout(updateResults, 120);
            }

            stoneInput.addEventListener('input', requestUpdate);
            woodInput.addEventListener('input', requestUpdate);
            metalInput.addEventListener('input', requestUpdate);

            // При потере фокуса приводим к числу
            [stoneInput, woodInput, metalInput].forEach(inp => {
                inp.addEventListener('blur', function() {
                    const val = parseInt(this.value) || 0;
                    this.value = val;
                    requestUpdate();
                });
            });

            // Начальная проверка (если были значения)
            setTimeout(() => {
                const s = parseInt(stoneInput.value) || 0;
                const w = parseInt(woodInput.value) || 0;
                const m = parseInt(metalInput.value) || 0;
                if (s || w || m) {
                    lastStone = s; lastWood = w; lastMetal = m;
                    updateResults();
                }
            }, 100);
        })();
    </script>
</body>
</html>
