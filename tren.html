<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FitTrack Pro</title>
  <!-- BUG FIX: Chart.js was used but never imported -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #070B14;
      --surface:     #0D1421;
      --card:        #111827;
      --card-hover:  #161f32;
      --input-bg:    #1a2540;
      --border:      rgba(255,255,255,0.07);
      --border-focus:rgba(0,212,255,0.5);
      --primary:     #00D4FF;
      --primary-dim: rgba(0,212,255,0.12);
      --primary-glow:rgba(0,212,255,0.25);
      --danger:      #FF4D6D;
      --danger-dim:  rgba(255,77,109,0.12);
      --success:     #00FF88;
      --success-dim: rgba(0,255,136,0.12);
      --warning:     #FFB800;
      --warning-dim: rgba(255,184,0,0.12);
      --text:        #E8EDF5;
      --text-sub:    #6B7A99;
      --text-muted:  #3D4F6E;
      --radius:      16px;
      --radius-sm:   10px;
      --safe-top:    env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
      --shadow:      0 8px 32px rgba(0,0,0,0.4);
      --tr:          all 0.2s cubic-bezier(0.4,0,0.2,1);
      --grad-primary:linear-gradient(135deg,#00D4FF,#0070E0);
      --grad-danger: linear-gradient(135deg,#FF4D6D,#C73652);
      --grad-success:linear-gradient(135deg,#00FF88,#00C25A);
      --grad-warn:   linear-gradient(135deg,#FFB800,#FF7A00);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}

    body{
      font-family:'Plus Jakarta Sans',sans-serif;
      background:var(--bg);
      color:var(--text);
      padding-top:var(--safe-top);
      padding-bottom:calc(96px + var(--safe-bottom));
      -webkit-font-smoothing:antialiased;
      line-height:1.5;
      min-height:-webkit-fill-available;
      /* Subtle noise texture */
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%,rgba(0,100,255,0.08) 0%,transparent 60%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    }

    /* ─── HEADER ─────────────────────────────── */
    .header {
      position:sticky;top:0;z-index:100;
      background:rgba(7,11,20,0.92);
      backdrop-filter:saturate(180%) blur(24px);
      -webkit-backdrop-filter:saturate(180%) blur(24px);
      border-bottom:1px solid var(--border);
      padding:0 16px;
      padding-top:max(12px,var(--safe-top));
      height:calc(60px + max(12px,var(--safe-top)));
      display:flex;align-items:flex-end;padding-bottom:10px;
      justify-content:space-between;
    }

    .header-left{display:flex;align-items:center;gap:14px}
    .header-right{display:flex;align-items:center;gap:8px}

    .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
    .logo-mark{
      width:34px;height:34px;
      background:var(--grad-primary);
      border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      font-family:'Bebas Neue',sans-serif;
      font-size:20px;color:#fff;letter-spacing:0;
      box-shadow:0 0 20px var(--primary-glow);
    }
    .logo-text{
      font-family:'Bebas Neue',sans-serif;
      font-size:22px;letter-spacing:2px;
      background:var(--grad-primary);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }

    .user-pill{
      position:relative;display:flex;align-items:center;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:40px;
      padding:4px 10px 4px 8px;
      gap:6px;
      transition:var(--tr);
    }
    .user-pill:hover{border-color:var(--border-focus)}
    .user-pill-avatar{
      width:24px;height:24px;border-radius:50%;
      background:var(--grad-primary);
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:700;color:#000;
      flex-shrink:0;
    }
    .user-pill select{
      background:transparent;border:none;
      color:var(--text);font-size:13px;font-weight:600;
      -webkit-appearance:none;appearance:none;
      cursor:pointer;padding-right:14px;
      font-family:inherit;
    }
    .user-pill select:focus{outline:none}
    .user-pill::after{
      content:'⌄';position:absolute;right:10px;top:50%;
      transform:translateY(-52%);font-size:12px;
      color:var(--text-sub);pointer-events:none;
    }

    .hbtn{
      width:36px;height:36px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;cursor:pointer;
      transition:var(--tr);position:relative;
      color:var(--text);
    }
    .hbtn:hover{background:var(--card-hover);border-color:var(--border-focus);transform:translateY(-1px)}
    .hbtn:active{transform:scale(0.93)}
    .hbtn.on{background:var(--primary-dim);border-color:var(--primary);box-shadow:0 0 12px var(--primary-glow)}

    /* ─── CONTAINER ──────────────────────────── */
    .container{padding:20px 16px;max-width:520px;margin:0 auto}

    /* ─── SECTION LABEL ──────────────────────── */
    .label{
      font-size:11px;font-weight:700;letter-spacing:1.5px;
      text-transform:uppercase;color:var(--text-sub);
      margin:24px 0 10px;
      display:flex;justify-content:space-between;align-items:center;
      padding:0 2px;
    }

    /* ─── WORKOUT STATS BAR ──────────────────── */
    .stats-bar{
      display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
      margin-bottom:20px;
      animation:fadeUp .4s ease both;
    }
    .stat-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius-sm);
      padding:12px 8px;text-align:center;
      transition:var(--tr);
    }
    .stat-card:hover{border-color:var(--border-focus);transform:translateY(-2px)}
    .stat-val{
      font-family:'Bebas Neue',sans-serif;
      font-size:26px;letter-spacing:1px;
      color:var(--primary);
      line-height:1;margin-bottom:4px;
    }
    .stat-lbl{font-size:10px;color:var(--text-sub);font-weight:600;letter-spacing:.5px;text-transform:uppercase}

    /* ─── CARD ───────────────────────────────── */
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      overflow:hidden;
      margin-bottom:12px;
      transition:var(--tr);
    }

    /* ─── INPUTS ─────────────────────────────── */
    .input-row{
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      transition:var(--tr);
    }
    .input-row:last-child{border-bottom:none}
    .input-row:focus-within{background:rgba(0,212,255,0.03)}

    .sel-wrap{position:relative}
    .sel-wrap::after{
      content:'▾';font-size:13px;color:var(--text-sub);
      position:absolute;right:14px;top:50%;transform:translateY(-50%);
      pointer-events:none;transition:var(--tr);
    }

    select,input{
      width:100%;
      background:var(--input-bg);
      border:1px solid var(--border);
      border-radius:var(--radius-sm);
      color:var(--text);
      font-size:15px;font-weight:500;
      padding:12px 14px;
      -webkit-appearance:none;appearance:none;
      transition:var(--tr);
      font-family:inherit;
    }
    select:focus,input:focus{
      outline:none;
      border-color:var(--primary);
      box-shadow:0 0 0 3px var(--primary-dim);
    }
    input::placeholder{color:var(--text-muted)}
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none}

    /* ─── HINT ───────────────────────────────── */
    .hint-row{
      padding:10px 16px;
      background:var(--primary-dim);
      border-bottom:1px solid rgba(0,212,255,0.15);
      display:flex;justify-content:space-between;align-items:center;
      font-size:13px;color:var(--primary);gap:8px;
    }

    /* ─── SET ROWS ───────────────────────────── */
    .set-row{
      display:flex;align-items:center;gap:10px;
      padding:12px 14px;
      border-bottom:1px solid var(--border);
      animation:slideX .25s ease both;
      transition:background .15s;
    }
    .set-row:last-child{border-bottom:none}
    .set-row:hover{background:rgba(255,255,255,0.02)}

    .set-num{
      width:28px;text-align:center;
      font-family:'Bebas Neue',sans-serif;font-size:20px;
      color:var(--text-muted);flex-shrink:0;
    }
    .set-inputs{display:flex;gap:8px;flex:1}
    .set-inputs input{
      text-align:center;font-weight:700;font-size:17px;
      padding:10px 6px;
    }
    .set-unit{
      font-size:11px;color:var(--text-sub);
      text-align:center;margin-top:3px;
      font-weight:600;letter-spacing:.5px;
    }
    .set-field{flex:1}

    .del-btn{
      width:32px;height:32px;flex-shrink:0;
      background:var(--danger-dim);
      border:1px solid rgba(255,77,109,0.2);
      border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:var(--tr);color:var(--danger);font-size:14px;
    }
    .del-btn:hover{background:var(--danger);color:#fff;transform:scale(1.1)}
    .del-btn:active{transform:scale(.9)}

    /* ─── PROGRESS BAR ───────────────────────── */
    .prog-wrap{margin:12px 0 20px;padding:0 2px}
    .prog-header{
      display:flex;justify-content:space-between;margin-bottom:6px;
      font-size:12px;color:var(--text-sub);font-weight:600;
    }
    .prog-track{
      height:4px;background:var(--input-bg);border-radius:2px;overflow:hidden;
    }
    .prog-fill{
      height:100%;background:var(--grad-primary);border-radius:2px;
      transition:width .4s cubic-bezier(0.4,0,0.2,1);
    }

    /* ─── BUTTONS ────────────────────────────── */
    button{
      background:var(--grad-primary);color:#000;
      border:none;font-size:15px;font-weight:700;
      padding:14px 20px;border-radius:var(--radius);
      cursor:pointer;transition:var(--tr);
      font-family:inherit;
      display:flex;align-items:center;justify-content:center;gap:8px;
      box-shadow:0 4px 16px var(--primary-glow);
    }
    button:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--primary-glow)}
    button:active{transform:scale(.97)}

    button.ghost{
      background:var(--card);color:var(--primary);
      border:1px solid var(--border);box-shadow:none;
    }
    button.ghost:hover{border-color:var(--primary);background:var(--primary-dim);box-shadow:none}

    button.danger-ghost{
      background:transparent;color:var(--danger);
      border:1px solid rgba(255,77,109,.25);box-shadow:none;
    }
    button.danger-ghost:hover{background:var(--danger-dim);border-color:var(--danger)}

    .chip-btn{
      background:var(--card);color:var(--primary);
      border:1px solid var(--border);
      font-size:12px;font-weight:700;
      padding:7px 14px;border-radius:40px;
      white-space:nowrap;cursor:pointer;transition:var(--tr);
      font-family:inherit;box-shadow:none;
      display:inline-flex;align-items:center;gap:5px;
    }
    .chip-btn:hover{background:var(--primary-dim);border-color:var(--primary);transform:translateY(-1px);box-shadow:none}
    .chip-btn.red{color:var(--danger);border-color:rgba(255,77,109,.25)}
    .chip-btn.red:hover{background:var(--danger-dim);border-color:var(--danger)}
    .chip-btn.green{color:var(--success);border-color:rgba(0,255,136,.25)}
    .chip-btn.green:hover{background:var(--success-dim);border-color:var(--success)}

    /* ─── QUICK WEIGHT ───────────────────────── */
    .qw-strip{
      display:flex;gap:8px;overflow-x:auto;
      padding:4px 0 16px;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .qw-strip::-webkit-scrollbar{display:none}
    .qw-btn{
      flex-shrink:0;
      background:var(--card);
      border:1px solid var(--border);
      color:var(--primary);font-size:13px;font-weight:700;
      padding:9px 16px;border-radius:40px;
      cursor:pointer;transition:var(--tr);font-family:inherit;
      box-shadow:none;
    }
    .qw-btn:hover{background:var(--primary-dim);border-color:var(--primary);transform:translateY(-1px);box-shadow:none}
    .qw-btn.reset{color:var(--danger);border-color:rgba(255,77,109,.25)}
    .qw-btn.reset:hover{background:var(--danger-dim);border-color:var(--danger)}

    /* ─── HISTORY ────────────────────────────── */
    .hist-group{margin-bottom:24px}
    .hist-date{
      font-size:12px;font-weight:700;letter-spacing:1px;
      text-transform:uppercase;color:var(--text-sub);
      margin-bottom:10px;padding-left:2px;
      display:flex;align-items:center;gap:8px;
    }
    .hist-date::before{
      content:'';width:3px;height:14px;
      background:var(--grad-primary);border-radius:2px;
    }

    .hist-item{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:16px;margin-bottom:8px;
      transition:var(--tr);
      animation:fadeUp .3s ease both;
    }
    .hist-item:hover{background:var(--card-hover);border-color:var(--border-focus);transform:translateY(-2px);box-shadow:var(--shadow)}

    .hist-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
    .hist-name{font-size:15px;font-weight:700;color:var(--text)}
    .hist-meta{font-size:11px;color:var(--text-sub);margin-top:3px}
    .hist-vol{
      font-family:'Bebas Neue',sans-serif;
      font-size:22px;color:var(--primary);letter-spacing:1px;
    }

    .tags{display:flex;flex-wrap:wrap;gap:6px}
    .tag{
      font-size:12px;font-weight:700;
      background:var(--primary-dim);color:var(--primary);
      border:1px solid rgba(0,212,255,.15);
      padding:5px 10px;border-radius:6px;
      transition:var(--tr);
    }
    .tag:hover{background:rgba(0,212,255,.2)}

    .hist-actions{
      display:flex;gap:8px;justify-content:flex-end;margin-top:12px;
      padding-top:12px;border-top:1px solid var(--border);
    }

    /* ─── FAB ────────────────────────────────── */
    .fab{
      position:fixed;
      bottom:max(20px,calc(20px + var(--safe-bottom)));
      left:50%;transform:translateX(-50%);
      width:calc(100% - 32px);max-width:488px;
      z-index:90;
      animation:fadeUp .4s ease both;
    }
    .fab button{
      width:100%;
      padding:17px;
      font-size:16px;
      border-radius:var(--radius);
      box-shadow:0 8px 32px var(--primary-glow),0 2px 8px rgba(0,0,0,.4);
      background:var(--grad-primary);color:#000;
    }
    .fab button:hover{box-shadow:0 12px 40px var(--primary-glow)}

    /* ─── LOADER ─────────────────────────────── */
    .spin{
      display:inline-block;width:18px;height:18px;
      border:2px solid rgba(0,0,0,.3);border-radius:50%;
      border-top-color:#000;animation:spin 1s linear infinite;
    }

    /* ─── MODAL ──────────────────────────────── */
    .modal{
      position:fixed;inset:0;
      background:rgba(0,0,0,.75);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      z-index:1000;display:none;align-items:flex-end;
    }
    .modal.active{display:flex;animation:fadeIn .2s ease}
    .modal-sheet{
      background:var(--surface);
      width:100%;
      border-radius:24px 24px 0 0;
      padding:24px 20px;
      padding-bottom:calc(24px + var(--safe-bottom));
      max-height:90vh;display:flex;flex-direction:column;
      border:1px solid var(--border);border-bottom:none;
      animation:slideUp .3s cubic-bezier(0.2,.8,.2,1);
      box-shadow:0 -20px 60px rgba(0,0,0,.5);
    }
    .modal-drag{
      width:36px;height:4px;background:var(--text-muted);
      border-radius:2px;margin:-10px auto 20px;cursor:grab;
    }
    .modal-title{font-size:18px;font-weight:800;margin-bottom:20px}
    .modal-close{
      background:var(--card);color:var(--primary);
      border:1px solid var(--border);
      font-size:13px;font-weight:600;
      padding:7px 14px;border-radius:8px;
      cursor:pointer;transition:var(--tr);font-family:inherit;
      box-shadow:none;white-space:nowrap;
    }
    .modal-close:hover{border-color:var(--primary);background:var(--primary-dim);box-shadow:none}

    /* ─── TABS ───────────────────────────────── */
    .tabs{
      display:flex;gap:4px;
      background:var(--input-bg);
      padding:4px;border-radius:12px;
      margin-bottom:20px;
    }
    .tab{
      flex:1;text-align:center;padding:10px;
      background:transparent;border:none;
      color:var(--text-sub);font-size:13px;font-weight:700;
      border-radius:9px;cursor:pointer;transition:var(--tr);
      font-family:inherit;
    }
    .tab:hover{color:var(--text);transform:none;box-shadow:none}
    .tab.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .tab-pane{display:none}
    .tab-pane.on{display:block}

    /* ─── PROFILE STATS ──────────────────────── */
    .profile-grid{
      display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;
    }
    .pstat{
      background:var(--input-bg);border:1px solid var(--border);
      border-radius:var(--radius-sm);padding:16px;text-align:center;
      transition:var(--tr);
    }
    .pstat:hover{border-color:var(--border-focus)}
    .pstat-val{
      font-family:'Bebas Neue',sans-serif;font-size:32px;
      color:var(--primary);letter-spacing:1px;line-height:1;margin-bottom:4px;
    }
    .pstat-lbl{font-size:11px;color:var(--text-sub);font-weight:700;letter-spacing:.5px;text-transform:uppercase}

    /* ─── COMPARISON TABLE ───────────────────── */
    .cmp-table{width:100%;border-collapse:collapse}
    .cmp-table th{
      padding:12px;background:rgba(255,255,255,.03);
      border-bottom:1px solid var(--border);
      font-size:10px;color:var(--text-sub);
      text-transform:uppercase;letter-spacing:1px;font-weight:700;
      text-align:left;
    }
    .cmp-table td{padding:12px;border-bottom:1px solid var(--border)}
    .cmp-table tr:last-child td{border-bottom:none}
    .cmp-table tr:hover td{background:rgba(255,255,255,.02)}
    .cmp-val{font-weight:700;color:var(--primary);text-align:right}

    /* ─── EMPTY STATE ────────────────────────── */
    .empty{
      text-align:center;padding:48px 20px;
      color:var(--text-muted);
    }
    .empty-icon{font-size:48px;margin-bottom:12px;opacity:.4}
    .empty-title{font-size:15px;color:var(--text-sub);font-weight:600;margin-bottom:6px}
    .empty-sub{font-size:13px}

    /* ─── TOAST ──────────────────────────────── */
    .toast{
      position:fixed;top:calc(16px + var(--safe-top));
      left:50%;transform:translateX(-50%) translateY(-120px);
      background:var(--card);
      padding:12px 18px;border-radius:var(--radius-sm);
      box-shadow:var(--shadow);z-index:2000;
      transition:transform .3s cubic-bezier(0.2,.8,.2,1);
      display:flex;align-items:center;gap:10px;
      border:1px solid var(--border);
      backdrop-filter:blur(20px);
      font-size:14px;font-weight:600;
      max-width:calc(100vw - 32px);white-space:pre-line;
      border-left:3px solid var(--primary);
    }
    .toast.show{transform:translateX(-50%) translateY(0)}
    .toast.success{border-left-color:var(--success)}
    .toast.error{border-left-color:var(--danger)}
    .toast.warning{border-left-color:var(--warning)}

    /* ─── CHART ──────────────────────────────── */
    .chart-wrap{width:100%;height:220px;position:relative;margin:12px 0}
    canvas{width:100%!important;height:100%!important}

    /* ─── IMPORT/EXPORT ROW ──────────────────── */
    .action-strip{
      display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;
    }

    .file-wrap{position:relative;display:inline-flex}
    .file-wrap input[type="file"]{
      position:absolute;inset:0;opacity:0;cursor:pointer;
      padding:0;border:none;background:none;border-radius:0;
      box-shadow:none;font-size:0;
    }
    .file-wrap input[type="file"]:focus{box-shadow:none}

    /* ─── KEYFRAMES ──────────────────────────── */
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes slideX{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

    /* ─── SCROLLBAR ──────────────────────────── */
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:2px}

    /* ─── RESPONSIVE ─────────────────────────── */
    @media(max-width:400px){
      .set-inputs{flex-direction:column;gap:8px}
      .stats-bar{grid-template-columns:repeat(2,1fr)}
      .logo-text{display:none}
    }
    @media(prefers-color-scheme:light){
      :root{
        --bg:#F0F4FC;--surface:#fff;--card:#fff;--card-hover:#F7FAFF;
        --input-bg:#EBF0FA;--border:rgba(0,0,0,.08);--border-focus:rgba(0,133,255,.4);
        --text:#0B0F1A;--text-sub:#5A6480;--text-muted:#A0ADCC;
        --primary:#005FD4;--primary-dim:rgba(0,95,212,.1);--primary-glow:rgba(0,95,212,.2);
      }
      body{background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(0,95,212,.06) 0%,transparent 60%)}
      .header{background:rgba(240,244,252,.94)}
      .stat-val,.hist-vol,.pstat-val,.set-num,.logo-mark,.logo-text,.logo-mark{color:#005FD4}
    }
  </style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────── -->
<header class="header">
  <div class="header-left">
    <div class="logo">
      <div class="logo-mark">F</div>
      <span class="logo-text">FitTrack</span>
    </div>
    <div class="user-pill">
      <div class="user-pill-avatar" id="userAvatar">?</div>
      <select id="userSelect" onchange="switchUser()"></select>
    </div>
  </div>
  <div class="header-right">
    <button class="hbtn" onclick="openExerciseManager()" title="Упражнения">🏋️</button>
    <button class="hbtn" onclick="openUserProfile()" title="Профиль">📊</button>
    <button class="hbtn" id="lockBtn" onclick="toggleEditMode()" title="Редактировать">✏️</button>
  </div>
</header>

<!-- ── MAIN ───────────────────────────────────────── -->
<div class="container">

  <!-- Workout stats -->
  <div id="workoutStats" class="stats-bar" style="display:none">
    <div class="stat-card">
      <div class="stat-val" id="totalVolume">0</div>
      <div class="stat-lbl">Объём кг</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="totalSets">0</div>
      <div class="stat-lbl">Подходы</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="bestSet">—</div>
      <div class="stat-lbl">Лучший</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="avgWeight">0</div>
      <div class="stat-lbl">Ср. вес</div>
    </div>
  </div>

  <!-- Exercise select -->
  <div class="label">Упражнение</div>
  <div class="card">
    <div class="input-row">
      <div class="sel-wrap">
        <select id="exerciseSelect" onchange="loadLastSessionHint()"></select>
      </div>
    </div>
    <div id="lastSessionHint" class="hint-row" style="display:none">
      <span id="hintText"></span>
    </div>
  </div>

  <!-- Sets -->
  <div class="label">
    Подходы
    <span style="font-size:12px;color:var(--text-sub);font-weight:600">
      <span id="completedSets">0</span>/<span id="totalSetsCount">0</span>
    </span>
  </div>

  <!-- Progress bar -->
  <div class="prog-wrap" id="progWrap">
    <div class="prog-header">
      <span>Прогресс</span>
      <span id="progLabel">0%</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>

  <div class="card" id="setsContainer"></div>

  <button class="ghost" onclick="addSet()" style="width:100%;margin-bottom:16px">
    ＋ Добавить подход
  </button>

  <!-- Quick weight -->
  <div class="qw-strip">
    <button class="qw-btn" onclick="quickWeight(20)">20 кг</button>
    <button class="qw-btn" onclick="quickWeight(40)">40 кг</button>
    <button class="qw-btn" onclick="quickWeight(60)">60 кг</button>
    <button class="qw-btn" onclick="quickWeight(80)">80 кг</button>
    <button class="qw-btn" onclick="quickWeight(100)">100 кг</button>
    <button class="qw-btn" onclick="quickWeight(120)">120 кг</button>
    <button class="qw-btn reset" onclick="resetLastSet()">Сброс</button>
  </div>

  <!-- History -->
  <div class="label">
    История
    <div style="display:flex;gap:6px">
      <button class="chip-btn" onclick="exportToCSV()">📤 CSV</button>
      <button class="chip-btn red" onclick="clearHistory()">🗑️</button>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px">
    <div class="sel-wrap">
      <select id="filterExercise" onchange="renderHistory()">
        <option value="">Все упражнения</option>
      </select>
    </div>
    <div class="action-strip">
      <div class="file-wrap">
        <button class="chip-btn green">📥 Импорт CSV</button>
        <input type="file" id="csvImport" accept=".csv" onchange="importFromCSV(event)">
      </div>
      <button class="chip-btn" onclick="showStats()">📊 Статистика</button>
      <button class="chip-btn" onclick="openUsersComparison()">👥 Сравнение</button>
    </div>
  </div>

  <div id="historyList"></div>
  <br><br>
</div>

<!-- ── FAB ────────────────────────────────────────── -->
<div class="fab">
  <button onclick="saveWorkout()" id="saveBtn">
    <span id="saveBtnText">💾 Сохранить тренировку</span>
    <span id="saveBtnLoader" class="spin" style="display:none"></span>
  </button>
</div>

<!-- ── TOAST ──────────────────────────────────────── -->
<div id="toast" class="toast"></div>

<!-- ── MODAL: EXERCISES ───────────────────────────── -->
<div class="modal" id="exerciseModal">
  <div class="modal-sheet">
    <div class="modal-drag"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div class="modal-title" style="margin:0">🏋️ Упражнения</div>
      <button class="modal-close" onclick="closeExerciseManager()">Готово</button>
    </div>
    <input type="text" id="searchExercise" placeholder="🔍 Поиск..." style="margin-bottom:12px" oninput="filterExercises()">
    <div style="overflow-y:auto;flex:1;min-height:200px;margin-bottom:12px" id="exerciseManagerList"></div>
    <div style="display:flex;gap:8px">
      <input id="newExerciseInput" placeholder="Новое упражнение" onkeypress="if(event.key==='Enter')addExercise()">
      <button onclick="addExercise()" style="width:auto;padding:12px 16px;flex-shrink:0">➕</button>
    </div>
  </div>
</div>

<!-- ── MODAL: USERS ───────────────────────────────── -->
<div class="modal" id="usersModal">
  <div class="modal-sheet">
    <div class="modal-drag"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div class="modal-title" style="margin:0">👥 Пользователи</div>
      <button class="modal-close" onclick="closeUsersManager()">Готово</button>
    </div>
    <div style="overflow-y:auto;flex:1;min-height:200px;margin-bottom:12px" id="usersManagerList"></div>
    <div style="display:flex;gap:8px">
      <input id="newUserName" placeholder="Новый пользователь" onkeypress="if(event.key==='Enter')addUser()">
      <button onclick="addUser()" style="width:auto;padding:12px 16px;flex-shrink:0">➕</button>
    </div>
  </div>
</div>

<!-- ── MODAL: STATS ───────────────────────────────── -->
<div class="modal" id="statsModal">
  <div class="modal-sheet">
    <div class="modal-drag"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div class="modal-title" style="margin:0">📊 Статистика</div>
      <button class="modal-close" onclick="closeStats()">Закрыть</button>
    </div>
    <div style="overflow-y:auto;flex:1;padding-right:4px" id="statsContent"></div>
  </div>
</div>

<!-- ── MODAL: PROFILE ─────────────────────────────── -->
<div class="modal" id="profileModal">
  <div class="modal-sheet">
    <div class="modal-drag"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div class="modal-title" style="margin:0">👤 Профиль</div>
      <button class="modal-close" onclick="closeUserProfile()">Готово</button>
    </div>
    <div class="tabs">
      <button class="tab on" onclick="switchTab('profile-tab',this)">Профиль</button>
      <button class="tab" onclick="switchTab('history-tab',this)">История</button>
      <button class="tab" onclick="switchTab('chart-tab',this)">График</button>
    </div>
    <div style="overflow-y:auto;flex:1">
      <div id="profile-tab" class="tab-pane on">
        <div class="profile-grid">
          <div class="pstat"><div class="pstat-val" id="profileHeight">—</div><div class="pstat-lbl">Рост см</div></div>
          <div class="pstat"><div class="pstat-val" id="profileWeight">—</div><div class="pstat-lbl">Вес кг</div></div>
          <div class="pstat"><div class="pstat-val" id="profileIMC">—</div><div class="pstat-lbl">ИМТ</div></div>
          <div class="pstat"><div class="pstat-val" id="profileWorkouts">0</div><div class="pstat-lbl">Тренировок</div></div>
        </div>
        <div class="label" style="margin-top:4px">Изменить параметры</div>
        <div style="display:flex;gap:10px;margin-bottom:14px">
          <input type="number" id="editHeight" placeholder="Рост (см)" min="100" max="250">
          <input type="number" id="editWeight" placeholder="Вес (кг)" min="30" max="200" step="0.1">
        </div>
        <button onclick="saveProfileParameters()" style="width:100%">💾 Сохранить</button>
        <div style="font-size:11px;color:var(--text-sub);text-align:center;margin-top:12px;line-height:1.8">
          ИМТ = вес (кг) ÷ рост² (м)<br>
          <span style="color:var(--success)">18.5–24.9</span> норма ·
          <span style="color:var(--warning)">25–29.9</span> избыток ·
          <span style="color:var(--danger)">≥30</span> ожирение
        </div>
      </div>
      <div id="history-tab" class="tab-pane">
        <div id="parametersHistory" style="max-height:340px;overflow-y:auto"></div>
      </div>
      <div id="chart-tab" class="tab-pane">
        <div class="chart-wrap"><canvas id="parametersChart"></canvas></div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="ghost" style="flex:1;font-size:12px;padding:9px" onclick="chartPeriod=7;renderParametersChart()">7 дн</button>
          <button class="ghost" style="flex:1;font-size:12px;padding:9px" onclick="chartPeriod=30;renderParametersChart()">30 дн</button>
          <button class="ghost" style="flex:1;font-size:12px;padding:9px" onclick="chartPeriod=90;renderParametersChart()">90 дн</button>
          <button class="ghost" style="flex:1;font-size:12px;padding:9px" onclick="chartPeriod=365;renderParametersChart()">Год</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── MODAL: COMPARISON ──────────────────────────── -->
<div class="modal" id="comparisonModal">
  <div class="modal-sheet">
    <div class="modal-drag"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div class="modal-title" style="margin:0">👥 Сравнение</div>
      <button class="modal-close" onclick="closeUsersComparison()">Закрыть</button>
    </div>
    <div style="margin-bottom:14px">
      <div class="sel-wrap">
        <select id="comparisonExercise" onchange="renderUsersComparison()">
          <option value="">Все упражнения</option>
        </select>
      </div>
    </div>
    <div style="overflow-y:auto;flex:1" id="comparisonContent"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════
     JAVASCRIPT
══════════════════════════════════════════════════ -->
<script>
// ─── Constants ────────────────────────────────────
const SK  = 'fitness_data_v8';
const EK  = 'fitness_exercises_v8';
const UK  = 'fitness_users_v5';
const CUK = 'fitness_current_user_v5';
const PK  = 'fitness_user_params_v1';

// ─── State ────────────────────────────────────────
let appData=[], exercises=[], currentSets=[], users=[];
let userParameters={}, currentUser=null;
let editMode=false, editingId=null, originalSetsBackup=null;
let chartPeriod=30, parametersChart=null;

// ─── Init ─────────────────────────────────────────
window.onload=()=>{
  appData=[]; exercises=[]; currentSets=[]; users=[]; userParameters={};

  loadUsers();
  loadCurrentUser();
  loadUserParameters();
  loadData();
  renderExercises();
  renderHistory();
  addSet();
  updateStats();
  updateProgress();

  const saved=sessionStorage.getItem(`currentSets_${currentUser?.id}`);
  if(saved){
    try{currentSets=JSON.parse(saved);if(!Array.isArray(currentSets))currentSets=[];}
    catch(e){currentSets=[];}
    renderSets();updateProgress();
  }

  window.addEventListener('beforeunload',autoSave);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)autoSave();});
};

// ─── Users ────────────────────────────────────────
function loadUsers(){
  try{
    const s=localStorage.getItem(UK);
    users=s?JSON.parse(s):[];
    if(!Array.isArray(users))users=[];
    if(!users.length){
      users=[
        {id:'user_ivan',  name:'Иван',  createdAt:Date.now()},
        {id:'user_andrey',name:'Андрей',createdAt:Date.now()+1}
      ];
      saveUsers();
    }
  }catch(e){
    users=[{id:'user_ivan',name:'Иван',createdAt:Date.now()}];
  }
}

function loadCurrentUser(){
  try{
    const s=localStorage.getItem(CUK);
    currentUser=s?JSON.parse(s):null;
    if(!currentUser||!users.some(u=>u.id===currentUser.id)){
      currentUser=users[0];saveCurrentUser();
    }
  }catch(e){currentUser=users[0];}
  renderUserSelector();
}

function loadUserParameters(){
  try{
    const s=localStorage.getItem(PK);
    userParameters=s?JSON.parse(s):{};
    if(typeof userParameters!=='object'||Array.isArray(userParameters))userParameters={};
    users.forEach(u=>{
      if(!userParameters[u.id])userParameters[u.id]={height:null,weight:null,history:[]};
    });
  }catch(e){
    userParameters={};
    users.forEach(u=>userParameters[u.id]={height:null,weight:null,history:[]});
  }
}

function saveUsers(){try{localStorage.setItem(UK,JSON.stringify(users));}catch(e){}}
function saveCurrentUser(){try{localStorage.setItem(CUK,JSON.stringify(currentUser));}catch(e){}}
function saveUserParams(){try{localStorage.setItem(PK,JSON.stringify(userParameters));}catch(e){}}

function renderUserSelector(){
  const sel=document.getElementById('userSelect');
  const av =document.getElementById('userAvatar');
  if(!sel)return;
  const old=sel.value;
  sel.innerHTML='';
  users.forEach(u=>{
    const o=new Option(u.name,u.id);
    o.selected=u.id===currentUser.id;
    sel.add(o);
  });
  sel.add(new Option('Управление...','manage'));
  if(users.some(u=>u.id===old))sel.value=old;
  if(av)av.textContent=currentUser.name[0].toUpperCase();
}

function switchUser(){
  const sel=document.getElementById('userSelect');
  if(!sel)return;
  const v=sel.value;
  if(v==='manage'){
    openUsersManager();
    setTimeout(()=>{sel.value=currentUser.id;},100);
    return;
  }
  const u=users.find(x=>x.id===v);
  if(u&&u.id!==currentUser.id){
    autoSave();
    currentUser=u;saveCurrentUser();
    loadData();renderExercises();renderHistory();updateStats();
    const sv=sessionStorage.getItem(`currentSets_${currentUser.id}`);
    if(sv){try{currentSets=JSON.parse(sv);if(!Array.isArray(currentSets))currentSets=[];}catch(e){currentSets=[];}}
    else{currentSets=[];addSet();}
    renderSets();renderUserSelector();updateProgress();
    showToast(`Пользователь: ${currentUser.name}`,'success');
  }
}

function openUsersManager(){renderUsersManagerList();document.getElementById('usersModal').classList.add('active');}
function closeUsersManager(){document.getElementById('usersModal').classList.remove('active');renderUserSelector();}

function renderUsersManagerList(){
  const c=document.getElementById('usersManagerList');
  if(!c)return;
  c.innerHTML='';
  if(!users.length){c.innerHTML='<div class="empty"><div class="empty-title">Нет пользователей</div></div>';return;}
  users.forEach((u,i)=>{
    const isCur=u.id===currentUser.id;
    const p=userParameters[u.id]||{};
    const bmi=p.height&&p.weight?(p.weight/((p.height/100)**2)).toFixed(1):'-';
    const el=document.createElement('div');
    el.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:10px;margin-bottom:6px;background:var(--input-bg);cursor:pointer;transition:background .15s';
    el.innerHTML=`
      <div style="display:flex;align-items:center;gap:10px;flex:1">
        <div style="width:32px;height:32px;border-radius:50%;background:var(--grad-primary);display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-size:14px;flex-shrink:0">${u.name[0].toUpperCase()}</div>
        <div style="flex:1">
          <div style="font-weight:${isCur?700:500};color:${isCur?'var(--primary)':'var(--text)'}">${u.name}${isCur?' <span style="font-size:10px;background:var(--success-dim);color:var(--success);padding:2px 6px;border-radius:4px;font-weight:700">текущий</span>':''}</div>
          <div style="font-size:11px;color:var(--text-sub)">${p.height?p.height+' см':'—'} · ${p.weight?p.weight+' кг':'—'} · ИМТ ${bmi}</div>
        </div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="hbtn" onclick="renameUser('${u.id}')" title="Переименовать" style="width:30px;height:30px;font-size:12px">✏️</button>
        ${u.id!=='user_ivan'?`<button class="hbtn" onclick="removeUser('${u.id}')" style="width:30px;height:30px;font-size:12px;color:var(--danger)">🗑️</button>`:''}
      </div>`;
    el.ondblclick=()=>{if(u.id!==currentUser.id)switchToUser(u.id);closeUsersManager();};
    c.appendChild(el);
  });
}

function addUser(){
  const inp=document.getElementById('newUserName');
  const v=inp.value.trim();
  if(!v){showToast('Введите имя','error');inp.focus();return;}
  if(users.some(u=>u.name.toLowerCase()===v.toLowerCase())){showToast('Уже существует','warning');return;}
  const nu={id:'user_'+Date.now()+'_'+Math.random().toString(36).substr(2,9),name:v,createdAt:Date.now()};
  users.push(nu);
  userParameters[nu.id]={height:null,weight:null,history:[]};
  saveUsers();saveUserParams();
  renderUsersManagerList();inp.value='';inp.focus();
  showToast(`"${v}" добавлен`,'success');
}

function renameUser(id){
  const u=users.find(x=>x.id===id);if(!u)return;
  const n=prompt('Новое имя:',u.name);
  if(!n||!n.trim()||n.trim()===u.name)return;
  if(users.some(x=>x.id!==id&&x.name.toLowerCase()===n.trim().toLowerCase())){showToast('Уже существует','error');return;}
  const old=u.name;u.name=n.trim();
  saveUsers();renderUsersManagerList();renderUserSelector();
  if(id===currentUser.id){currentUser=u;saveCurrentUser();}
  showToast(`"${old}" → "${n.trim()}"`,'success');
}

function removeUser(id){
  if(id==='user_ivan'){showToast('Нельзя удалить основного','warning');return;}
  const u=users.find(x=>x.id===id);if(!u)return;
  if(!confirm(`Удалить "${u.name}"? Все данные будут удалены.`))return;
  if(id===currentUser.id){
    currentUser=users.find(x=>x.id==='user_ivan')||users[0];
    saveCurrentUser();loadData();renderExercises();renderHistory();updateStats();
    currentSets=[];addSet();renderSets();
    sessionStorage.removeItem(`currentSets_${id}`);
  }
  localStorage.removeItem(`${SK}_${id}`);
  localStorage.removeItem(`${EK}_${id}`);
  delete userParameters[id];saveUserParams();
  users=users.filter(x=>x.id!==id);saveUsers();
  renderUsersManagerList();renderUserSelector();
  showToast(`"${u.name}" удалён`,'warning');
}

function switchToUser(id){
  const u=users.find(x=>x.id===id);
  if(!u||u.id===currentUser.id)return;
  autoSave();currentUser=u;saveCurrentUser();
  loadData();renderExercises();renderHistory();updateStats();
  const sv=sessionStorage.getItem(`currentSets_${currentUser.id}`);
  if(sv){try{currentSets=JSON.parse(sv);if(!Array.isArray(currentSets))currentSets=[];}catch(e){currentSets=[];}}
  else{currentSets=[];addSet();}
  renderSets();renderUserSelector();updateProgress();
  showToast(`→ ${currentUser.name}`,'success');
}

// ─── Data ─────────────────────────────────────────
function loadData(){
  try{
    const s=localStorage.getItem(`${SK}_${currentUser.id}`);
    appData=s?JSON.parse(s):[];
    if(!Array.isArray(appData))appData=[];
  }catch(e){appData=[];}
  try{
    const s=localStorage.getItem(`${EK}_${currentUser.id}`);
    exercises=s?JSON.parse(s):[];
    if(!Array.isArray(exercises))exercises=[];
  }catch(e){exercises=[];}
  if(!exercises.length){
    exercises=['Жим лежа','Приседания','Становая тяга','Жим стоя','Тяга блока'];
    saveExercises();
  }
}

function saveData(){
  try{
    if(!Array.isArray(appData))appData=[];
    localStorage.setItem(`${SK}_${currentUser.id}`,JSON.stringify(appData));
  }catch(e){showToast('Ошибка сохранения','error');}
}

function saveExercises(){
  try{localStorage.setItem(`${EK}_${currentUser.id}`,JSON.stringify(exercises));}catch(e){}
}

function autoSave(){
  if(currentSets.some(s=>s.weight||s.reps))
    sessionStorage.setItem(`currentSets_${currentUser.id}`,JSON.stringify(currentSets));
}

// ─── Sets ─────────────────────────────────────────
function addSet(){
  const last=currentSets.length?currentSets[currentSets.length-1]:{reps:'',weight:''};
  currentSets.push({id:Date.now()+Math.random(),reps:last.reps,weight:last.weight});
  renderSets();updateStats();updateProgress();
}

function removeSet(i){
  if(currentSets.length>1)currentSets.splice(i,1);
  else currentSets[0]={reps:'',weight:''};
  renderSets();updateStats();updateProgress();
}

function cleanNum(v,max){
  let s=v.replace(/[^\d.]/g,'');
  const p=s.split('.');
  if(p.length>2)s=p[0]+'.'+p.slice(1).join('');
  if(s.includes('.')){const[a,b]=s.split('.');if(b.length>1)s=a+'.'+b[0];}
  if(s==='.')s='0.';
  if(max&&parseFloat(s)>max)s=String(max);
  return s;
}

function updateSet(i,field,val){
  if(field==='weight')val=cleanNum(val,1000);
  if(field==='reps') val=cleanNum(val,200);
  if(currentSets[i])currentSets[i][field]=val;
  updateStats();updateProgress();
}

function renderSets(){
  const c=document.getElementById('setsContainer');
  if(!c)return;
  c.innerHTML='';
  if(!currentSets.length){
    c.innerHTML='<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Нет подходов</div></div>';
    return;
  }
  currentSets.forEach((set,i)=>{
    const row=document.createElement('div');
    row.className='set-row';
    row.innerHTML=`
      <span class="set-num">${i+1}</span>
      <div class="set-inputs">
        <div class="set-field">
          <input type="text" inputmode="decimal" placeholder="вес" value="${set.weight||''}"
            oninput="updateSet(${i},'weight',this.value)" pattern="[0-9]*[.]?[0-9]*">
          <div class="set-unit">кг</div>
        </div>
        <div class="set-field">
          <input type="text" inputmode="numeric" placeholder="повт" value="${set.reps||''}"
            oninput="updateSet(${i},'reps',this.value)" pattern="[0-9]*">
          <div class="set-unit">раз</div>
        </div>
      </div>
      <button class="del-btn" onclick="removeSet(${i})" title="Удалить">✕</button>`;
    c.appendChild(row);
  });
  const done=currentSets.filter(s=>s.reps&&s.weight).length;
  const total=currentSets.length;
  const dEl=document.getElementById('completedSets');
  const tEl=document.getElementById('totalSetsCount');
  if(dEl)dEl.textContent=done;
  if(tEl)tEl.textContent=total;
}

function updateProgress(){
  const done=currentSets.filter(s=>s.reps&&s.weight).length;
  const total=currentSets.length;
  const pct=total?Math.round(done/total*100):0;
  const fill=document.getElementById('progFill');
  const lbl=document.getElementById('progLabel');
  if(fill)fill.style.width=pct+'%';
  if(lbl)lbl.textContent=pct+'%';
}

// ─── Stats bar ────────────────────────────────────
function updateStats(){
  const valid=currentSets.filter(s=>s.reps&&s.weight);
  const box=document.getElementById('workoutStats');
  if(!box)return;
  if(!valid.length){box.style.display='none';return;}
  box.style.display='grid';
  const vol=valid.reduce((sum,s)=>sum+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0),0);
  const best=valid.reduce((b,s)=>{const v=(parseFloat(s.weight)||0)*(parseInt(s.reps)||0);return v>b.v?{s,v}:b},{s:null,v:0});
  const avgW=valid.reduce((sum,s)=>sum+(parseFloat(s.weight)||0),0)/valid.length;
  const v=id=>document.getElementById(id);
  if(v('totalVolume'))v('totalVolume').textContent=Math.round(vol);
  if(v('totalSets'))  v('totalSets').textContent=valid.length;
  if(v('bestSet'))    v('bestSet').textContent=best.s?`${best.s.weight}×${best.s.reps}`:'—';
  if(v('avgWeight'))  v('avgWeight').textContent=Math.round(avgW);
}

// ─── Save workout ─────────────────────────────────
async function saveWorkout(){
  if(!Array.isArray(appData))appData=[];
  const name=document.getElementById('exerciseSelect').value;
  const valid=currentSets.filter(s=>s.reps&&s.weight);
  if(!name||name==='Выбрать упражнение...'){showToast('Выберите упражнение','error');return;}
  if(!valid.length){showToast('Заполните хотя бы один подход','error');return;}
  if(navigator.vibrate)navigator.vibrate(50);

  const btn=document.getElementById('saveBtn');
  const txt=document.getElementById('saveBtnText');
  const ldr=document.getElementById('saveBtnLoader');
  if(!btn)return;
  btn.disabled=true;
  if(txt)txt.textContent='Сохранение...';
  if(ldr)ldr.style.display='inline-block';

  await new Promise(r=>setTimeout(r,500));

  const rec={
    id: editingId||(Date.now()+'-'+Math.random().toString(36).substr(2,9)),
    name,
    sets:JSON.parse(JSON.stringify(valid)),
    date: editingId?(appData.find(x=>x.id===editingId)?.date||Date.now()):Date.now(),
    volume:valid.reduce((s,x)=>(parseFloat(x.weight)||0)*(parseInt(x.reps)||0)+s,0),
    userId:currentUser.id
  };

  if(editingId){
    const idx=appData.findIndex(x=>x.id===editingId);
    if(idx!==-1)appData[idx]=rec;else appData.push(rec);
    editingId=null;originalSetsBackup=null;
    if(txt)txt.textContent='💾 Сохранить тренировку';
  }else{
    appData.push(rec);
  }

  saveData();
  currentSets=[];addSet();
  sessionStorage.removeItem(`currentSets_${currentUser.id}`);
  renderSets();renderHistory();updateStats();updateProgress();

  btn.disabled=false;
  if(txt)txt.textContent='💾 Сохранить тренировку';
  if(ldr)ldr.style.display='none';
  showToast('Тренировка сохранена! 🎉','success');

  const hl=document.getElementById('historyList');
  if(hl)window.scrollTo({top:hl.offsetTop-80,behavior:'smooth'});
}

// ─── Render history ───────────────────────────────
function renderHistory(){
  const c=document.getElementById('historyList');
  if(!c)return;
  if(!Array.isArray(appData))appData=[];
  const flt=document.getElementById('filterExercise');
  const filter=flt?flt.value:'';

  if(!appData.length){
    c.innerHTML=`<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">История пуста</div><div class="empty-sub">Начните добавлять тренировки!</div></div>`;
    return;
  }

  let data=filter?appData.filter(x=>x.name===filter):appData;
  data=[...data].sort((a,b)=>b.date-a.date);

  if(!data.length){
    c.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Нет тренировок для фильтра</div></div>`;
    return;
  }

  c.innerHTML='';
  const grouped=data.reduce((g,item)=>{
    const d=new Date(item.date).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
    (g[d]=g[d]||[]).push(item);return g;
  },{});

  Object.entries(grouped).forEach(([date,items])=>{
    const grp=document.createElement('div');
    grp.className='hist-group';
    grp.innerHTML=`<div class="hist-date">${date} <span style="font-weight:500;color:var(--text-muted)">${items.length} ${plural(items.length,['тренировка','тренировки','тренировок'])}</span></div>`;

    items.forEach(item=>{
      if(!Array.isArray(item.sets))return;
      const vol=item.sets.reduce((s,x)=>(parseFloat(x.weight)||0)*(parseInt(x.reps)||0)+s,0);
      const tags=item.sets.map((s,i)=>`<span class="tag">${s.weight||0}×${s.reps||0}</span>`).join('');
      const actions=editMode?`<div class="hist-actions">
        <button class="ghost" style="font-size:13px;padding:8px 14px;width:auto" onclick="editRec('${item.id}')">✏️ Изменить</button>
        <button class="danger-ghost" style="font-size:13px;padding:8px 14px;width:auto" onclick="delRec('${item.id}')">🗑️ Удалить</button>
      </div>`:'';
      const el=document.createElement('div');
      el.className='hist-item';
      el.innerHTML=`
        <div class="hist-head">
          <div>
            <div class="hist-name">${item.name||'—'}</div>
            <div class="hist-meta">
              ${new Date(item.date).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
              · ${item.sets.length} ${plural(item.sets.length,['подход','подхода','подходов'])}
              · объём ${Math.round(vol)} кг
            </div>
          </div>
          <div class="hist-vol">${Math.round(vol)}<span style="font-size:14px;font-family:inherit"> кг</span></div>
        </div>
        <div class="tags">${tags}</div>
        ${actions}`;
      grp.appendChild(el);
    });
    c.appendChild(grp);
  });
}

function plural(n,f){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return f[2];if(n1>1&&n1<5)return f[1];if(n1===1)return f[0];return f[2];}

// ─── Edit / Delete ────────────────────────────────
function editRec(id){
  if(!Array.isArray(appData))return;
  const rec=appData.find(x=>x.id===id);
  if(!rec){showToast('Запись не найдена','error');return;}
  document.getElementById('exerciseSelect').value=rec.name;
  currentSets=JSON.parse(JSON.stringify(rec.sets||[]));
  editingId=id;
  originalSetsBackup=JSON.parse(JSON.stringify(rec.sets||[]));
  const txt=document.getElementById('saveBtnText');
  if(txt)txt.textContent='✏️ Обновить тренировку';
  renderSets();updateStats();updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
  showToast('Редактирование…','warning');
}

function delRec(id){
  if(!confirm('Удалить эту тренировку?'))return;
  if(!Array.isArray(appData))appData=[];
  appData=appData.filter(x=>x.id!==id);
  saveData();renderHistory();
  showToast('Тренировка удалена','error');
}

function clearHistory(){
  if(!confirm('Удалить ВСЮ историю? Отменить нельзя.'))return;
  appData=[];saveData();renderHistory();
  showToast('История очищена','error');
}

// ─── Edit mode ────────────────────────────────────
function toggleEditMode(){
  if(editMode&&editingId&&originalSetsBackup){
    if(!confirm('Отменить редактирование?'))return;
    currentSets=[{id:Date.now()+Math.random(),reps:'',weight:''}];
    editingId=null;originalSetsBackup=null;
    const txt=document.getElementById('saveBtnText');
    if(txt)txt.textContent='💾 Сохранить тренировку';
    renderSets();updateStats();updateProgress();
    showToast('Редактирование отменено','warning');
    editMode=false;
    const lb=document.getElementById('lockBtn');
    if(lb)lb.classList.remove('on');
    renderHistory();return;
  }
  editMode=!editMode;
  const lb=document.getElementById('lockBtn');
  if(lb){
    if(editMode){lb.classList.add('on');showToast('Режим редактирования','warning');}
    else{lb.classList.remove('on');showToast('Редактирование выключено','success');}
  }
  renderHistory();
}

// ─── Hint ─────────────────────────────────────────
function loadLastSessionHint(){
  const name=document.getElementById('exerciseSelect').value;
  const hint=document.getElementById('lastSessionHint');
  if(!name||name==='Выбрать упражнение...'||!hint){if(hint)hint.style.display='none';return;}
  if(!Array.isArray(appData)){hint.style.display='none';return;}
  const last=[...appData.filter(x=>x.name===name)].sort((a,b)=>b.date-a.date)[0];
  if(!last||!Array.isArray(last.sets)||!last.sets.length){hint.style.display='none';return;}
  const best=last.sets.reduce((b,s)=>{const v=(parseFloat(s.weight)||0)*(parseInt(s.reps)||0);return v>b.v?{s,v}:b},{s:null,v:0});
  if(!best.s){hint.style.display='none';return;}
  const vol=last.sets.reduce((s,x)=>(parseFloat(x.weight)||0)*(parseInt(x.reps)||0)+s,0);
  const days=Math.floor((Date.now()-last.date)/86400000);
  const when=days===0?'сегодня':days===1?'вчера':`${days} дн. назад`;
  const ht=document.getElementById('hintText');
  if(ht)ht.innerHTML=`<span><b>${when}:</b> ${best.s.weight}кг×${best.s.reps} (лучший)</span><span style="color:var(--text-sub);font-size:11px">${last.sets.length} подхода · ${Math.round(vol)} кг</span>`;
  hint.style.display='flex';
}

function renderExercises(){
  const sel=document.getElementById('exerciseSelect');
  const flt=document.getElementById('filterExercise');
  const cmp=document.getElementById('comparisonExercise');
  if(!sel||!flt)return;
  const sv=sel.value,fv=flt.value;
  if(!Array.isArray(exercises)){exercises=['Жим лежа','Приседания'];saveExercises();}
  sel.innerHTML='<option disabled selected>Выбрать упражнение...</option>';
  flt.innerHTML='<option value="">Все упражнения</option>';
  if(cmp)cmp.innerHTML='<option value="">Все упражнения</option>';
  [...exercises].sort().forEach(e=>{
    sel.add(new Option(e,e));
    flt.add(new Option(e,e));
    if(cmp)cmp.add(new Option(e,e));
  });
  if(exercises.includes(sv))sel.value=sv;
  if(exercises.includes(fv))flt.value=fv;
}

  });

function addExercise(){
  const inp=document.getElementById('newExerciseInput');
  const v=inp.value.trim();
  if(!v){showToast('Введите название','error');inp.focus();return;}
  if(exercises.includes(v)){showToast('Уже существует','warning');inp.focus();return;}
  exercises.push(v);saveExercises();renderExerciseManagerList();inp.value='';inp.focus();
  showToast(`"${v}" добавлено`,'success');
}

function removeExercise(i){
  if(!confirm(`Удалить "${exercises[i]}"?`))return;
  const n=exercises[i];exercises.splice(i,1);saveExercises();renderExerciseManagerList();
  showToast(`"${n}" удалено`,'warning');
}

function renameExercise(i){
  const n=prompt('Новое название:',exercises[i]);
  if(!n||!n.trim()||n.trim()===exercises[i])return;
  if(exercises.includes(n.trim())){showToast('Уже существует','error');return;}
  const old=exercises[i];
  exercises[i]=n.trim();
  appData.forEach(r=>{if(r.name===old)r.name=n.trim();});
  saveExercises();saveData();renderExerciseManagerList();renderExercises();
  showToast(`"${old}" → "${n.trim()}"`,'success');
}

// ─── Export / Import ──────────────────────────────
function exportToCSV(){
  if(!appData.length){showToast('История пуста','warning');return;}
  try{
    let csv='data:text/csv;charset=utf-8,\uFEFF';
    csv+='Дата;Время;Упражнение;Подход;Вес (кг);Повторы;Объем\n';
    [...appData].sort((a,b)=>a.date-b.date).forEach(w=>{
      const d=new Date(w.date);
      const ds=d.toLocaleDateString('ru-RU');
      const ts=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
      w.sets.forEach((s,i)=>{
        const wt=parseFloat(s.weight)||0,rp=parseInt(s.reps)||0;
        csv+=`${ds};${ts};"${w.name}";${i+1};"${wt}";"${rp}";"${wt*rp}"\n`;
      });
    });
    const a=document.createElement('a');
    a.href=encodeURI(csv);
    a.download=`fittrack_${currentUser.name}_${new Date().toISOString().split('T')[0]}.csv`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    showToast('CSV экспортирован','success');
  }catch(e){showToast('Ошибка экспорта','error');}
}

function importFromCSV(ev){
  const file=ev.target.files[0];
  if(!file){showToast('Файл не выбран','warning');return;}
  if(!file.name.toLowerCase().endsWith('.csv')){showToast('Нужен CSV файл','error');ev.target.value='';return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const lines=e.target.result.split('\n');
      let imported=0;
      const wks=[];
      for(let i=1;i<lines.length;i++){
        const ln=lines[i].trim();if(!ln)continue;
        const v=ln.split(';').map(x=>x.trim().replace(/"/g,''));
        if(v.length<7)continue;
        const[ds,ts,en,,ws,rs]=v;
        if(!en)continue;
        let dt;
        try{
          if(ds.includes('.')){const[d,m,y]=ds.split('.');dt=new Date(y,m-1,d);if(ts){const[h,min]=ts.split(':');dt.setHours(+h||0,+min||0);}}
          else dt=new Date(ds+' '+ts);
        }catch{dt=new Date();}
        if(isNaN(dt))dt=new Date();
        const wt=parseFloat(ws.replace(',','.'))||0;
        const rp=parseInt(rs)||0;
        if(!wt||!rp||!en)continue;
        const xi=wks.findIndex(w=>w.name===en&&Math.abs(new Date(w.date)-dt)<86400000);
        if(xi>=0){wks[xi].sets.push({weight:wt,reps:rp});wks[xi].volume+=wt*rp;}
        else wks.push({id:Date.now()+'-'+Math.random().toString(36).substr(2,9)+'-'+i,name:en,sets:[{weight:wt,reps:rp}],date:dt.getTime(),volume:wt*rp,userId:currentUser.id});
        if(!exercises.includes(en))exercises.push(en);
        imported++;
      }
      if(wks.length){
        appData.push(...wks);saveExercises();saveData();
        renderExercises();renderHistory();
        showToast(`Импортировано ${imported} строк`,'success');
      }else showToast('Нет данных для импорта','warning');
    }catch(e){showToast('Ошибка импорта','error');}
    finally{ev.target.value='';}
  };
  reader.onerror=()=>{showToast('Ошибка чтения файла','error');ev.target.value='';};
  reader.readAsText(file,'UTF-8');
}

// ─── Stats modal ──────────────────────────────────
function showStats(){
  const c=document.getElementById('statsContent');if(!c)return;
  if(!appData.length){
    c.innerHTML='<div class="empty"><div class="empty-icon">📊</div><div class="empty-title">Нет данных</div></div>';
    document.getElementById('statsModal').classList.add('active');return;
  }
  const totalWk=appData.length;
  const totalEx=[...new Set(appData.map(w=>w.name))].length;
  const totalSt=appData.reduce((s,w)=>s+w.sets.length,0);
  const totalVl=appData.reduce((s,w)=>s+(w.volume||0),0);
  const exCnt=appData.reduce((a,w)=>{a[w.name]=(a[w.name]||0)+1;return a;},{});
  const top=Object.entries(exCnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const best={};
  appData.forEach(w=>{
    if(!best[w.name])best[w.name]={maxW:0,tot:0,wks:0};
    w.sets.forEach(s=>{best[w.name].maxW=Math.max(best[w.name].maxW,parseFloat(s.weight)||0);best[w.name].tot+=w.sets.length;});
    best[w.name].wks++;
  });
  const bestList=Object.entries(best).sort((a,b)=>b[1].maxW-a[1].maxW).slice(0,5);
  const first=new Date(Math.min(...appData.map(w=>w.date)));
  const days=Math.floor((Date.now()-first)/86400000);
  const p=userParameters[currentUser.id]||{};
  const bmi=p.height&&p.weight?(p.weight/((p.height/100)**2)).toFixed(1):'-';
  c.innerHTML=`
    <div class="profile-grid" style="margin:0 0 20px">
      <div class="pstat"><div class="pstat-val">${totalWk}</div><div class="pstat-lbl">Тренировок</div></div>
      <div class="pstat"><div class="pstat-val">${totalEx}</div><div class="pstat-lbl">Упражнений</div></div>
      <div class="pstat"><div class="pstat-val">${totalSt}</div><div class="pstat-lbl">Подходов</div></div>
      <div class="pstat"><div class="pstat-val">${Math.round(totalVl)}</div><div class="pstat-lbl">кг объём</div></div>
    </div>
    <div class="label" style="margin-top:0">Параметры</div>
    <div class="card" style="margin-bottom:20px">
      ${[['Рост',p.height?p.height+' см':'—'],['Вес',p.weight?p.weight+' кг':'—'],['ИМТ',bmi]].map(([l,v])=>`
        <div class="input-row" style="display:flex;justify-content:space-between">
          <span style="color:var(--text-sub)">${l}</span>
          <span style="font-weight:700;color:var(--primary)">${v}</span>
        </div>`).join('')}
    </div>
    <div class="label">Топ упражнений</div>
    <div class="card" style="margin-bottom:20px">
      ${top.map(([n,cnt],i)=>`
        <div class="input-row" style="display:flex;justify-content:space-between${i===top.length-1?';border-bottom:none':''}">
          <span>${i+1}. ${n}</span>
          <span style="color:var(--primary);font-weight:700">${cnt} тр.</span>
        </div>`).join('')}
    </div>
    <div class="label">Лучшие результаты</div>
    <div class="card" style="margin-bottom:20px">
      ${bestList.map(([n,s],i)=>`
        <div class="input-row" style="display:flex;justify-content:space-between${i===bestList.length-1?';border-bottom:none':''}">
          <span>${i+1}. ${n}</span>
          <span style="color:var(--primary);font-weight:700">${Math.round(s.maxW)} кг</span>
        </div>`).join('')}
    </div>
    <div class="label">Общее</div>
    <div class="card">
      ${[['Пользователь',currentUser.name],['Старт',first.toLocaleDateString('ru-RU')],['Дней активности',days],['Ср. объём/тр.',Math.round(totalVl/totalWk)+' кг']].map(([l,v],i,a)=>`
        <div class="input-row" style="display:flex;justify-content:space-between${i===a.length-1?';border-bottom:none':''}">
          <span style="color:var(--text-sub)">${l}</span>
          <span style="font-weight:600">${v}</span>
        </div>`).join('')}
    </div>`;
  document.getElementById('statsModal').classList.add('active');
}
function closeStats(){document.getElementById('statsModal').classList.remove('active');}

// ─── Profile ──────────────────────────────────────
function openUserProfile(){loadUserProfile();document.getElementById('profileModal').classList.add('active');}
function closeUserProfile(){document.getElementById('profileModal').classList.remove('active');}

function loadUserProfile(){
  const p=userParameters[currentUser.id]||{height:null,weight:null,history:[]};
  const bmi=p.height&&p.weight?(p.weight/((p.height/100)**2)).toFixed(1):'—';
  document.getElementById('profileHeight').textContent=p.height?p.height:'—';
  document.getElementById('profileWeight').textContent=p.weight?p.weight:'—';
  document.getElementById('profileIMC').textContent=bmi;
  document.getElementById('profileWorkouts').textContent=appData.length;
  document.getElementById('editHeight').value=p.height||'';
  document.getElementById('editWeight').value=p.weight||'';
  loadParamsHistory();
  renderParametersChart();
}

function saveProfileParameters(){
  const h=parseFloat(document.getElementById('editHeight').value);
  const w=parseFloat(document.getElementById('editWeight').value);
  if((h&&(h<100||h>250))||(w&&(w<30||w>200))){showToast('Некорректные значения','error');return;}
  if(!userParameters[currentUser.id])userParameters[currentUser.id]={height:null,weight:null,history:[]};
  const p=userParameters[currentUser.id];
  const oh=p.height,ow=p.weight;
  p.height=h||null;p.weight=w||null;
  if((h&&h!==oh)||(w&&w!==ow)){
    if(!p.history)p.history=[];
    p.history.unshift({date:Date.now(),height:h||oh,weight:w||ow});
    if(p.history.length>100)p.history=p.history.slice(0,100);
  }
  saveUserParams();loadUserProfile();
  showToast('Параметры сохранены','success');
}

function loadParamsHistory(){
  const c=document.getElementById('parametersHistory');if(!c)return;
  const p=userParameters[currentUser.id]||{history:[]};
  if(!p.history||!p.history.length){
    c.innerHTML='<div class="empty"><div class="empty-title">Нет истории</div><div class="empty-sub">Добавьте рост и вес</div></div>';
    return;
  }
  c.innerHTML='';
  p.history.forEach(e=>{
    const bmi=e.height&&e.weight?(e.weight/((e.height/100)**2)).toFixed(1):'—';
    const el=document.createElement('div');
    el.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:10px;margin-bottom:8px;background:var(--input-bg)';
    el.innerHTML=`
      <div>
        <div style="font-size:12px;color:var(--text-sub)">${new Date(e.date).toLocaleDateString('ru-RU')} ${new Date(e.date).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div>
        <div style="font-weight:600;margin-top:4px">${e.height||'—'} см · ${e.weight||'—'} кг</div>
      </div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--primary)">ИМТ ${bmi}</div>`;
    c.appendChild(el);
  });
}

// BUG FIX: Chart.js options can't use CSS vars — use literal colors
function renderParametersChart(){
  const canvas=document.getElementById('parametersChart');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const p=userParameters[currentUser.id]||{history:[]};
  const cut=Date.now()-chartPeriod*86400000;
  const hist=[...(p.history||[])].filter(e=>e.date>=cut).sort((a,b)=>a.date-b.date);

  if(parametersChart){parametersChart.destroy();parametersChart=null;}

  if(hist.length<2){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#6B7A99';ctx.font='14px Plus Jakarta Sans,sans-serif';
    ctx.textAlign='center';ctx.fillText('Недостаточно данных',canvas.width/2,canvas.height/2);
    return;
  }

  const labels=hist.map(e=>new Date(e.date).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}));
  const weights=hist.map(e=>e.weight||null);
  const heights=hist.map(e=>e.height||null);

  parametersChart=new Chart(ctx,{
    type:'line',
    data:{
      labels,
      datasets:[
        {label:'Вес (кг)',data:weights,borderColor:'#00D4FF',backgroundColor:'rgba(0,212,255,0.08)',tension:0.4,fill:true,pointBackgroundColor:'#00D4FF',pointRadius:4,spanGaps:true},
        {label:'Рост (см)',data:heights,borderColor:'#00FF88',backgroundColor:'rgba(0,255,136,0.06)',tension:0.4,fill:true,pointBackgroundColor:'#00FF88',pointRadius:4,spanGaps:true}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{labels:{color:'#E8EDF5',font:{size:12,family:'Plus Jakarta Sans'}}},
        tooltip:{backgroundColor:'#111827',titleColor:'#E8EDF5',bodyColor:'#E8EDF5',borderColor:'rgba(255,255,255,0.07)',borderWidth:1}
      },
      scales:{
        x:{ticks:{color:'#6B7A99'},grid:{color:'rgba(255,255,255,0.04)'}},
        y:{ticks:{color:'#6B7A99'},grid:{color:'rgba(255,255,255,0.04)'}}
      }
    }
  });
}

// ─── Comparison ───────────────────────────────────
function openUsersComparison(){renderUsersComparison();document.getElementById('comparisonModal').classList.add('active');}
function closeUsersComparison(){document.getElementById('comparisonModal').classList.remove('active');}

function loadUserData(uid){
  try{const s=localStorage.getItem(`${SK}_${uid}`);const d=s?JSON.parse(s):[];return Array.isArray(d)?d:[];}
  catch(e){return [];}
}

function renderUsersComparison(){
  const c=document.getElementById('comparisonContent');
  const ex=(document.getElementById('comparisonExercise')||{}).value||'';
  if(!c)return;
  if(users.length<2){c.innerHTML='<div class="empty"><div class="empty-title">Нужно ≥2 пользователей</div></div>';return;}
  const stats=users.map(u=>{
    const d=loadUserData(u.id);
    const fd=ex?d.filter(x=>x.name===ex):d;
    const p=userParameters[u.id]||{};
    const vol=fd.reduce((s,w)=>s+(w.volume||0),0);
    let mx=0;fd.forEach(w=>w.sets.forEach(s=>{const wt=parseFloat(s.weight)||0;if(wt>mx)mx=wt;}));
    const bmi=p.height&&p.weight?(p.weight/((p.height/100)**2)).toFixed(1):'-';
    const last=fd.length?new Date(Math.max(...fd.map(w=>w.date))).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}):'-';
    return{id:u.id,name:u.name,height:p.height,weight:p.weight,bmi,wks:fd.length,sets:fd.reduce((s,w)=>s+w.sets.length,0),vol,avgVol:fd.length?Math.round(vol/fd.length):0,mx,last};
  }).sort((a,b)=>b.vol-a.vol);

  let html=`<div style="overflow-x:auto"><table class="cmp-table">
    <thead><tr><th>Пользователь</th><th>Рост/Вес</th><th>Тренировок</th><th>Объём</th><th>Рекорд</th></tr></thead>
    <tbody>`;
  stats.forEach(s=>{
    const cur=s.id===currentUser.id;
    html+=`<tr style="${cur?'background:rgba(0,212,255,.05)':''}">
      <td>
        <div style="font-weight:${cur?700:500};color:${cur?'var(--primary)':'var(--text)'}">${s.name}</div>
        <div style="font-size:11px;color:var(--text-sub)">${s.last}</div>
      </td>
      <td>
        <div>${s.height?s.height+' см':'—'}</div>
        <div style="font-size:11px;color:var(--text-sub)">${s.weight?s.weight+' кг':'—'}</div>
        <div style="font-size:10px;color:var(--${s.bmi!=='-'?(s.bmi<18.5||s.bmi>=25?'warning':'success'):'text-sub'})">${s.bmi!=='-'?'ИМТ '+s.bmi:''}</div>
      </td>
      <td class="cmp-val">${s.wks}</td>
      <td class="cmp-val"><div>${Math.round(s.vol)} кг</div><div style="font-size:10px;color:var(--text-sub)">${s.avgVol} кг/тр.</div></td>
      <td class="cmp-val">${Math.round(s.mx)} кг</td>
    </tr>`;
  });
  html+=`</tbody></table></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px">
    ${[['👥','Пользователей',stats.length],['🏋️','Тренировок',stats.reduce((s,x)=>s+x.wks,0)],['📦','Общий объём кг',Math.round(stats.reduce((s,x)=>s+x.vol,0))],['🏆','Рекорд кг',Math.round(Math.max(...stats.map(s=>s.mx)))]].map(([ic,l,v])=>`
      <div class="pstat">
        <div style="font-size:24px;margin-bottom:4px">${ic}</div>
        <div class="pstat-val" style="font-size:24px">${v}</div>
        <div class="pstat-lbl">${l}</div>
      </div>`).join('')}
  </div>`;
  c.innerHTML=html;
}

// ─── Tabs ─────────────────────────────────────────
// BUG FIX: original switchTab didn't receive the clicked button ref, causing querySelector to fail
function switchTab(id,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.tab-pane').forEach(t=>t.classList.remove('on'));
  if(btn)btn.classList.add('on');
  const p=document.getElementById(id);
  if(p)p.classList.add('on');
}

// ─── Toast ────────────────────────────────────────
function showToast(msg,type='info'){
  const t=document.getElementById('toast');if(!t)return;
  const icons={success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
  t.innerHTML=`${icons[type]||'ℹ️'} ${msg}`;
  t.className=`toast ${type} show`;
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>{t.classList.remove('show');},3000);
}

// ─── Event delegation ─────────────────────────────
document.addEventListener('click',e=>{
  if(e.target.classList.contains('modal'))e.target.classList.remove('active');
});

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveWorkout();}
  if(e.key==='Escape')document.querySelectorAll('.modal.active').forEach(m=>m.classList.remove('active'));
});
</script>
