<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FitTrack Pro</title>
  <!-- No external CDN — all rendering is pure JS/CSS -->
  <style>
:root{
  --bg:        #FFF5F5;
  --surface:   #FFFFFF;
  --card:      #FFFFFF;
  --card-hover:#FFFAFA;
  --input-bg:  #F4F4F4;
  --border:    #EBEBEB;
  --primary:   #E60023;
  --primary-dim:rgba(230,0,35,.08);
  --primary-glow:rgba(230,0,35,.18);
  --danger:    #CC0018;
  --danger-dim:rgba(204,0,24,.09);
  --success:   #00A400;
  --success-dim:rgba(0,164,0,.09);
  --warning:   #CC6600;
  --warning-dim:rgba(204,102,0,.09);
  --text:      #111111;
  --text-sub:  #767676;
  --text-muted:#ADADAD;
  --radius:    16px;
  --radius-sm: 10px;
  --safe-top:  env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --shadow:    0 2px 10px rgba(0,0,0,.06);
  --shadow-lg: 0 6px 28px rgba(0,0,0,.10);
  --tr:        all .18s cubic-bezier(.4,0,.2,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-top:var(--safe-top);
  padding-bottom:calc(88px + var(--safe-bottom));
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  min-height:100dvh;
}

/* ─── HEADER ──────────────────────── */
.header{
  position:sticky;top:0;z-index:200;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding-left:14px;padding-right:14px;
  padding-top:var(--safe-top);
  height:calc(54px + var(--safe-top));
  display:flex;align-items:flex-end;padding-bottom:0;
}
.header-inner{
  width:100%;max-width:520px;margin:0 auto;
  display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;height:54px;gap:10px;
}
.logo{display:flex;align-items:center;gap:7px;flex-shrink:0;text-decoration:none;}
.logo-mark{
  width:30px;height:30px;border-radius:9px;
  background:var(--primary);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:#fff;
  box-shadow:0 2px 8px var(--primary-glow);flex-shrink:0;
}
.logo-text{
  font-size:16px;font-weight:800;color:var(--primary);
  letter-spacing:-.2px;white-space:nowrap;
}

/* user pill left side */
.user-pill{
  min-width:0;max-width:150px;
  position:relative;display:flex;align-items:center;gap:5px;
  background:var(--input-bg);border:1.5px solid var(--border);
  border-radius:999px;padding:4px 22px 4px 5px;
  transition:border-color .15s;
  justify-self:center;
}
.user-pill:focus-within{border-color:var(--primary)}
.user-pill-avatar{
  width:22px;height:22px;min-width:22px;border-radius:50%;
  background:var(--primary);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:#fff;
}
.user-pill select{
  background:transparent;border:none;color:var(--text);
  font-size:13px;font-weight:600;-webkit-appearance:none;appearance:none;
  cursor:pointer;font-family:inherit;width:100%;min-width:0;padding:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.user-pill select:focus{outline:none}
.user-pill::after{
  content:"▾";position:absolute;right:8px;top:50%;
  transform:translateY(-52%);font-size:10px;
  color:var(--text-sub);pointer-events:none;
}

/* menu button right side */
.menu-wrap{position:relative;flex-shrink:0;justify-self:end}

.hbtn{
  width:34px;height:34px;min-width:34px;flex-shrink:0;
  background:var(--input-bg);border:1.5px solid var(--border);
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:var(--tr);
  color:var(--text);padding:0;box-shadow:none;
}
.hbtn:hover{background:#E9E9E9;border-color:#C8C8C8;transform:none;box-shadow:none}
.hbtn:active{transform:scale(.9);box-shadow:none}
.hbtn.on{background:var(--primary-dim);border-color:var(--primary);color:var(--primary)}
.hbtn svg{display:block;pointer-events:none}

/* ─── DROPDOWN MENU ─────────────── */
.menu-dropdown{
  position:absolute;top:calc(100% + 8px);right:0;
  background:#fff;border:1.5px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow-lg);
  min-width:210px;z-index:500;
  overflow:hidden;
  animation:fadeUp .18s ease both;
  display:none;
}
.menu-dropdown.open{display:block}
.menu-item{
  display:flex;align-items:center;gap:11px;
  padding:12px 16px;cursor:pointer;
  font-size:14px;font-weight:600;color:var(--text);
  transition:background .12s;border:none;background:transparent;
  width:100%;text-align:left;font-family:inherit;
  box-shadow:none;
  justify-content:flex-start;
}
.menu-item:hover{background:#FFF5F5;color:var(--primary);transform:none;filter:none}
.menu-item:hover svg{stroke:var(--primary)}
.menu-item:active{background:var(--primary-dim);transform:none}
.menu-item svg{flex-shrink:0;stroke:var(--text-sub);transition:stroke .12s}
.menu-item.danger{color:var(--danger)}
.menu-item.danger svg{stroke:var(--danger)}
.menu-item.danger:hover{background:#FFF0F0;color:var(--danger)}
.menu-sep{height:1px;background:var(--border);margin:4px 0}

/* ─── LAYOUT ──────────────────────── */
.container{padding:16px;max-width:520px;margin:0 auto}

.label{
  font-size:11px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--text-sub);
  margin:20px 0 9px;
  display:flex;justify-content:space-between;align-items:center;
}

/* ─── STATS BAR ───────────────────── */
.stats-bar{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin-bottom:16px;animation:fadeUp .3s ease both;
}
@media(max-width:360px){.stats-bar{grid-template-columns:repeat(2,1fr)}}
.stat-card{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 6px;text-align:center;
  box-shadow:var(--shadow);transition:var(--tr);
}
.stat-card:hover{border-color:var(--primary);transform:translateY(-1px)}
.stat-val{font-size:22px;font-weight:800;color:var(--primary);line-height:1;margin-bottom:3px}
.stat-lbl{font-size:10px;color:var(--text-sub);font-weight:600;letter-spacing:.4px;text-transform:uppercase}

/* ─── CARD ────────────────────────── */
.card{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:10px;
  box-shadow:var(--shadow);transition:var(--tr);
}

/* ─── INPUTS ──────────────────────── */
.input-row{padding:12px 14px;border-bottom:1px solid var(--border);transition:background .12s}
.input-row:last-child{border-bottom:none}
.input-row:focus-within{background:rgba(230,0,35,.02)}

.sel-wrap{position:relative}
.sel-wrap::after{
  content:"▾";font-size:12px;color:var(--text-sub);
  position:absolute;right:13px;top:50%;transform:translateY(-50%);pointer-events:none;
}

select,input{
  width:100%;background:var(--input-bg);
  border:1.5px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);font-size:15px;font-weight:500;padding:11px 13px;
  -webkit-appearance:none;appearance:none;
  transition:border-color .15s,box-shadow .15s;font-family:inherit;
}
select:focus,input:focus{
  outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-dim);
}
input::placeholder{color:var(--text-muted)}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none}

/* ─── HINT ────────────────────────── */
.hint-row{
  padding:9px 14px;background:var(--primary-dim);
  border-top:1px solid rgba(230,0,35,.1);
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--primary);gap:8px;
}

/* ─── SET ROWS ────────────────────── */
.set-row{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;border-bottom:1px solid var(--border);
  animation:slideX .2s ease both;transition:background .12s;
}
.set-row:last-child{border-bottom:none}
.set-row:hover{background:rgba(230,0,35,.02)}

.set-num{width:24px;text-align:center;font-size:14px;font-weight:700;color:var(--text-muted);flex-shrink:0}
.set-inputs{display:flex;gap:8px;flex:1}
.set-inputs input{text-align:center;font-weight:700;font-size:18px;padding:9px 4px}
.set-unit{font-size:10px;color:var(--text-sub);text-align:center;margin-top:2px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.set-field{flex:1}

.del-btn{
  width:30px;height:30px;flex-shrink:0;
  background:var(--danger-dim);border:1px solid rgba(204,0,24,.15);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:var(--tr);color:var(--danger);font-size:13px;padding:0;box-shadow:none;
}
.del-btn:hover{background:var(--danger);color:#fff;transform:scale(1.08);filter:none}
.del-btn:active{transform:scale(.9)}

/* ─── PROGRESS ────────────────────── */
.prog-wrap{margin:10px 0 16px;padding:0 2px}
.prog-header{display:flex;justify-content:space-between;margin-bottom:5px;font-size:11px;color:var(--text-sub);font-weight:600}
.prog-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--primary);border-radius:3px;transition:width .35s ease}

/* ─── BUTTONS ─────────────────────── */
button{
  background:var(--primary);color:#fff;border:none;
  font-size:15px;font-weight:700;padding:13px 20px;border-radius:var(--radius);
  cursor:pointer;transition:var(--tr);font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 2px 10px var(--primary-glow);
}
button:hover{filter:brightness(1.07);box-shadow:0 4px 18px var(--primary-glow);transform:translateY(-1px)}
button:active{transform:scale(.97);filter:none}

button.ghost{background:var(--input-bg);color:var(--primary);border:1.5px solid var(--border);box-shadow:none}
button.ghost:hover{border-color:var(--primary);background:var(--primary-dim);box-shadow:none;transform:none;filter:none}

button.danger-ghost{background:transparent;color:var(--danger);border:1.5px solid rgba(204,0,24,.2);box-shadow:none}
button.danger-ghost:hover{background:var(--danger-dim);border-color:var(--danger);transform:none;filter:none}

.chip-btn{
  background:var(--card);color:var(--text-sub);border:1.5px solid var(--border);
  font-size:12px;font-weight:600;padding:6px 13px;border-radius:999px;
  white-space:nowrap;cursor:pointer;transition:var(--tr);font-family:inherit;
  box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:4px;
}
.chip-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-dim);box-shadow:none;transform:none;filter:none}
.chip-btn.red{color:var(--danger);border-color:rgba(204,0,24,.2)}
.chip-btn.red:hover{background:var(--danger-dim);border-color:var(--danger);color:var(--danger)}
.chip-btn.green{color:var(--success);border-color:rgba(0,164,0,.2)}
.chip-btn.green:hover{background:var(--success-dim);border-color:var(--success);transform:none}

/* ─── QUICK STRIP ─────────────────── */
.qw-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.qw-mode-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-sub)}
.qw-mode-pill{
  font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;
  background:var(--primary-dim);color:var(--primary);border:1px solid rgba(230,0,35,.15);
}
.qw-mode-pill.reps{background:var(--success-dim);color:var(--success);border-color:rgba(0,164,0,.2)}

.qw-strip{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.qw-strip::-webkit-scrollbar{display:none}
.qw-btn{
  flex-shrink:0;background:var(--card);border:1.5px solid var(--border);
  color:var(--primary);font-size:13px;font-weight:700;
  padding:8px 15px;border-radius:999px;cursor:pointer;font-family:inherit;
  box-shadow:var(--shadow);transition:var(--tr);
}
.qw-btn:hover{border-color:var(--primary);background:var(--primary-dim);box-shadow:none;transform:none;filter:none}
.qw-btn:active{transform:scale(.94)}
.qw-btn.reps-mode{color:var(--success);border-color:rgba(0,164,0,.25)}
.qw-btn.reps-mode:hover{background:var(--success-dim);border-color:var(--success)}
.qw-btn.reset{color:var(--danger);border-color:rgba(204,0,24,.2)}
.qw-btn.reset:hover{background:var(--danger-dim);border-color:var(--danger)}

/* ─── HISTORY ─────────────────────── */
.hist-group{margin-bottom:20px}
.hist-date{
  font-size:11px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--text-sub);margin-bottom:8px;
  display:flex;align-items:center;gap:7px;
}
.hist-date::before{content:"";width:3px;height:12px;background:var(--primary);border-radius:2px;flex-shrink:0}

.hist-item{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:14px;margin-bottom:8px;
  box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s;
  animation:fadeUp .25s ease both;
}
.hist-item:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.hist-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.hist-name{font-size:15px;font-weight:700}
.hist-meta{font-size:11px;color:var(--text-sub);margin-top:2px}
.hist-vol{font-size:20px;font-weight:800;color:var(--primary)}

.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;font-weight:600;background:var(--primary-dim);color:var(--primary);
  border:1px solid rgba(230,0,35,.12);padding:4px 9px;border-radius:6px;transition:var(--tr)}
.tag:hover{background:rgba(230,0,35,.14)}

.hist-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}

/* ─── FAB ─────────────────────────── */
.fab{
  position:fixed;left:16px;right:16px;
  bottom:max(16px, calc(var(--safe-bottom) + 16px));
  max-width:488px;margin:0 auto;z-index:90;
}
.fab button{width:100%;padding:15px 20px;font-size:16px;border-radius:var(--radius);box-shadow:0 4px 20px var(--primary-glow)}
.fab button:hover{transform:translateY(-2px);box-shadow:0 8px 28px var(--primary-glow);filter:brightness(1.05)}
.fab button:active{transform:scale(.97)}
.fab button:disabled{transform:none;opacity:.6;pointer-events:none}

/* ─── SPINNER ─────────────────────── */
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-radius:50%;border-top-color:#fff;animation:spin 1s linear infinite}

/* ─── MODAL ───────────────────────── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1000;display:none;align-items:flex-end}
.modal.active{display:flex;animation:fadeIn .18s ease}
.modal-sheet{
  background:var(--surface);width:100%;
  border-radius:24px 24px 0 0;padding:20px 16px;
  padding-bottom:calc(20px + var(--safe-bottom));
  max-height:92dvh;display:flex;flex-direction:column;
  box-shadow:0 -8px 40px rgba(0,0,0,.12);
  border-top:1.5px solid var(--border);
  animation:slideUp .28s cubic-bezier(.2,.8,.2,1);
}
.modal-drag{width:36px;height:4px;background:var(--border);border-radius:2px;margin:-6px auto 18px}
.modal-title{font-size:17px;font-weight:800;color:var(--text)}
.modal-close{
  background:var(--input-bg);color:var(--text-sub);border:1.5px solid var(--border);
  font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;
  cursor:pointer;font-family:inherit;box-shadow:none;transition:var(--tr);white-space:nowrap;
}
.modal-close:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-dim);box-shadow:none;transform:none;filter:none}

/* ─── TABS ────────────────────────── */
.tabs{display:flex;gap:3px;background:var(--input-bg);padding:4px;border-radius:12px;margin-bottom:16px}
.tab{
  flex:1;text-align:center;padding:9px;background:transparent;border:none;
  color:var(--text-sub);font-size:13px;font-weight:700;border-radius:9px;
  cursor:pointer;transition:var(--tr);font-family:inherit;box-shadow:none;
}
.tab:hover{color:var(--text);transform:none;box-shadow:none;filter:none}
.tab.on{background:var(--card);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,.07)}
.tab-pane{display:none}
.tab-pane.on{display:block;animation:fadeUp .2s ease both}

/* ─── PROFILE ─────────────────────── */
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.pstat{background:var(--input-bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center}
.pstat-val{font-size:28px;font-weight:800;color:var(--primary);line-height:1;margin-bottom:3px}
.pstat-lbl{font-size:10px;color:var(--text-sub);font-weight:700;letter-spacing:.4px;text-transform:uppercase}

/* ─── CMP TABLE ───────────────────── */
.cmp-table{width:100%;border-collapse:collapse;font-size:13px}
.cmp-table th{padding:10px 12px;background:var(--input-bg);border-bottom:1.5px solid var(--border);font-size:10px;color:var(--text-sub);text-transform:uppercase;letter-spacing:1px;font-weight:700;text-align:left}
.cmp-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.cmp-table tr:last-child td{border-bottom:none}
.cmp-table tr:hover td{background:rgba(230,0,35,.02)}
.cmp-val{font-weight:700;color:var(--primary);text-align:right}

/* ─── EMPTY ───────────────────────── */
.empty{text-align:center;padding:44px 20px;color:var(--text-muted)}
.empty-icon{font-size:44px;margin-bottom:10px;opacity:.3}
.empty-title{font-size:14px;color:var(--text-sub);font-weight:600;margin-bottom:5px}
.empty-sub{font-size:12px}

/* ─── TOAST ───────────────────────── */
.toast{
  position:fixed;top:calc(12px + var(--safe-top));
  left:50%;transform:translateX(-50%) translateY(-100px);
  background:var(--card);padding:10px 16px;border-radius:12px;
  box-shadow:var(--shadow-lg);z-index:2000;
  transition:transform .25s cubic-bezier(.2,.8,.2,1);
  display:flex;align-items:center;gap:9px;
  border:1.5px solid var(--border);border-left:3px solid var(--primary);
  font-size:14px;font-weight:600;
  max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}

/* ─── CHART ───────────────────────── */
.chart-wrap{width:100%;height:200px;position:relative;margin:12px 0}
canvas{width:100%!important;height:100%!important}

/* ─── FILE INPUT ──────────────────── */
.file-wrap{position:relative;display:inline-flex}
.file-wrap input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;padding:0;border:none;background:none;border-radius:0;box-shadow:none;font-size:0}
.file-wrap input[type="file"]:focus{box-shadow:none}
.action-strip{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}

/* ─── KEYFRAMES ───────────────────── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes slideX{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── SCROLLBAR ───────────────────── */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ─── RESPONSIVE ──────────────────── */
@media(max-width:360px){
  .container{padding:12px}
  .hbtn{width:30px;height:30px;font-size:13px}
  .user-pill{max-width:110px}
}
  </style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────── -->
<header class="header">
<div class="header-inner">
  <a class="logo">
    <div class="logo-mark">F</div>
    <span class="logo-text">Fitness</span>
  </a>
  <div class="user-pill">
    <div class="user-pill-avatar" id="userAvatar">?</div>

<!-- ══════════════════════════════════════════════════
     JAVASCRIPT
══════════════════════════════════════════════════ -->
<script>
// ─── Constants ────────────────────────────────────
const SK  = 'fitness_data_v8';
const EK  = 'fitness_exercises_v8';
const UK  = 'fitness_users_v5';
const CUK = 'fitness_current_user_v5';
const PK  = 'fitness_user_params_v1';

// ─── State ────────────────────────────────────────
let appData=[], exercises=[], currentSets=[], users=[];
let userParameters={}, currentUser=null;
let editMode=false, editingId=null, originalSetsBackup=null;
let chartPeriod=30;
// Tracks which field type is currently focused ('weight' or 'reps')
let activeSetField='weight';
let activeSetIndex=-1;

// ─── Init ─────────────────────────────────────────
window.onload=()=>{
  appData=[]; exercises=[]; currentSets=[]; users=[]; userParameters={};

  loadUsers();
  loadCurrentUser();
  loadUserParameters();
  loadData();
  renderExercises();
  renderHistory();
  addSet();
  updateStats();
  updateProgress();
  renderQuickStrip();

  const saved=sessionStorage.getItem(`currentSets_${currentUser?.id}`);
  if(saved){
    try{currentSets=JSON.parse(saved);if(!Array.isArray(currentSets))currentSets=[];}
    catch(e){currentSets=[];}
    renderSets();updateProgress();
  }

  window.addEventListener('beforeunload',autoSave);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)autoSave();});
};

// ─── Users ────────────────────────────────────────
function loadUsers(){
  try{
    const s=localStorage.getItem(UK);
    users=s?JSON.parse(s):[];
    if(!Array.isArray(users))users=[];
    if(!users.length){
      users=[
        {id:'user_ivan',  name:'Иван',  createdAt:Date.now()},
        {id:'user_andrey',name:'Андрей',createdAt:Date.now()+1}
      ];
      saveUsers();
    }
  }catch(e){
    users=[{id:'user_ivan',name:'Иван',createdAt:Date.now()}];
  }
}

function loadCurrentUser(){
  try{
    const s=localStorage.getItem(CUK);
    currentUser=s?JSON.parse(s):null;
    if(!currentUser||!users.some(u=>u.id===currentUser.id)){
      currentUser=users[0];saveCurrentUser();
    }
  }catch(e){currentUser=users[0];}
  renderUserSelector();
}

function loadUserParameters(){
  try{
    const s=localStorage.getItem(PK);
    userParameters=s?JSON.parse(s):{};
    if(typeof userParameters!=='object'||Array.isArray(userParameters))userParameters={};
    users.forEach(u=>{
      if(!userParameters[u.id])userParameters[u.id]={height:null,weight:null,history:[]};
    });
  }catch(e){
    userParameters={};
    users.forEach(u=>userParameters[u.id]={height:null,weight:null,history:[]});
  }
}

function saveUsers(){try{localStorage.setItem(UK,JSON.stringify(users));}catch(e){}}
function saveCurrentUser(){try{localStorage.setItem(CUK,JSON.stringify(currentUser));}catch(e){}}
function saveUserParams(){try{localStorage.setItem(PK,JSON.stringify(userParameters));}catch(e){}}

function renderUserSelector(){
  const sel=document.getElementById('userSelect');
  const av =document.getElementById('userAvatar');
  if(!sel)return;
  const old=sel.value;
  sel.innerHTML='';
  users.forEach(u=>{
    const o=new Option(u.name,u.id);
    o.selected=u.id===currentUser.id;
    sel.add(o);
  });
  sel.add(new Option('Управление...','manage'));
  if(users.some(u=>u.id===old))sel.value=old;
  if(av)av.textContent=currentUser.name[0].toUpperCase();
}

function switchUser(){
  const sel=document.getElementById('userSelect');
  if(!sel)return;
  const v=sel.value;
  if(v==='manage'){
    openUsersManager();
    setTimeout(()=>{sel.value=currentUser.id;},100);
    return;
  }
  const u=users.find(x=>x.id===v);
  if(u&&u.id!==currentUser.id){
    autoSave();
    currentUser=u;saveCurrentUser();
    loadData();renderExercises();renderHistory();updateStats();
    const sv=sessionStorage.getItem(`currentSets_${currentUser.id}`);
    if(sv){try{currentSets=JSON.parse(sv);if(!Array.isArray(currentSets))currentSets=[];}catch(e){currentSets=[];}}
    else{currentSets=[];addSet();}
    renderSets();renderUserSelector();updateProgress();
    showToast(`Пользователь: ${currentUser.name}`,'success');
  }
}

function closeUsersManager(){document.getElementById('usersModal').classList.remove('active');renderUserSelector();}

function addUser(){
  const inp=document.getElementById('newUserName');
  const v=inp.value.trim();
  if(!v){showToast('Введите имя','error');inp.focus();return;}
  if(users.some(u=>u.name.toLowerCase()===v.toLowerCase())){showToast('Уже существует','warning');return;}
  const nu={id:'user_'+Date.now()+'_'+Math.random().toString(36).substr(2,9),name:v,createdAt:Date.now()};
  users.push(nu);
  userParameters[nu.id]={height:null,weight:null,history:[]};
  saveUsers();saveUserParams();
  renderUsersManagerList();inp.value='';inp.focus();
  showToast(`"${v}" добавлен`,'success');
}

function renameUser(id){
  const u=users.find(x=>x.id===id);if(!u)return;
  const n=prompt('Новое имя:',u.name);
  if(!n||!n.trim()||n.trim()===u.name)return;
  if(users.some(x=>x.id!==id&&x.name.toLowerCase()===n.trim().toLowerCase())){showToast('Уже существует','error');return;}
  const old=u.name;u.name=n.trim();
  saveUsers();renderUsersManagerList();renderUserSelector();
  if(id===currentUser.id){currentUser=u;saveCurrentUser();}
  showToast(`"${old}" → "${n.trim()}"`,'success');
}

function removeUser(id){
  if(id==='user_ivan'){showToast('Нельзя удалить основного','warning');return;}
  const u=users.find(x=>x.id===id);if(!u)return;
  if(!confirm(`Удалить "${u.name}"? Все данные будут удалены.`))return;
  if(id===currentUser.id){
    currentUser=users.find(x=>x.id==='user_ivan')||users[0];
    saveCurrentUser();loadData();renderExercises();renderHistory();updateStats();
    currentSets=[];addSet();renderSets();
    sessionStorage.removeItem(`currentSets_${id}`);
  }
  localStorage.removeItem(`${SK}_${id}`);
  localStorage.removeItem(`${EK}_${id}`);
  delete userParameters[id];saveUserParams();
  users=users.filter(x=>x.id!==id);saveUsers();
  renderUsersManagerList();renderUserSelector();
  showToast(`"${u.name}" удалён`,'warning');
}

function switchToUser(id){
  const u=users.find(x=>x.id===id);
  if(!u||u.id===currentUser.id)return;
  autoSave();currentUser=u;saveCurrentUser();
  loadData();renderExercises();renderHistory();updateStats();
  const sv=sessionStorage.getItem(`currentSets_${currentUser.id}`);
  if(sv){try{currentSets=JSON.parse(sv);if(!Array.isArray(currentSets))currentSets=[];}catch(e){currentSets=[];}}
  else{currentSets=[];addSet();}
  renderSets();renderUserSelector();updateProgress();
  showToast(`→ ${currentUser.name}`,'success');
}

// ─── Data ─────────────────────────────────────────
function loadData(){
  try{
    const s=localStorage.getItem(`${SK}_${currentUser.id}`);
    appData=s?JSON.parse(s):[];
    if(!Array.isArray(appData))appData=[];
  }catch(e){appData=[];}
  try{
    const s=localStorage.getItem(`${EK}_${currentUser.id}`);
    exercises=s?JSON.parse(s):[];
    if(!Array.isArray(exercises))exercises=[];
  }catch(e){exercises=[];}
  if(!exercises.length){
    exercises=['Жим лежа','Приседания','Становая тяга','Жим стоя','Тяга блока'];
    saveExercises();
  }
}

function saveData(){
  try{
    if(!Array.isArray(appData))appData=[];
    localStorage.setItem(`${SK}_${currentUser.id}`,JSON.stringify(appData));
  }catch(e){showToast('Ошибка сохранения','error');}
}

function saveExercises(){
  try{localStorage.setItem(`${EK}_${currentUser.id}`,JSON.stringify(exercises));}catch(e){}
}

function autoSave(){
  if(currentSets.some(s=>s.weight||s.reps))
    sessionStorage.setItem(`currentSets_${currentUser.id}`,JSON.stringify(currentSets));
}

// ─── Quick strip ──────────────────────────────────
const WEIGHT_VALS=[20,40,60,80,100,120,140];
const REPS_VALS  =[2,4,6,8,10,12,15];

function renderQuickStrip(){
  const strip=document.getElementById('qwStrip');
  const pill =document.getElementById('qwModePill');
  if(!strip)return;
  const isReps=(activeSetField==='reps');
  if(pill){
    pill.textContent=isReps?'Повторы':'Вес';
    pill.className='qw-mode-pill'+(isReps?' reps':'');
  }
  strip.innerHTML='';
  const vals=isReps?REPS_VALS:WEIGHT_VALS;
  vals.forEach(v=>{
    const b=document.createElement('button');
    b.className='qw-btn'+(isReps?' reps-mode':'');
    b.textContent=isReps?`${v} раз`:`${v} кг`;
    b.onclick=()=>isReps?quickReps(v):quickWeight(v);
    strip.appendChild(b);
  });
  const rst=document.createElement('button');
  rst.className='qw-btn reset';
  rst.textContent='Сброс';
  rst.onclick=resetLastSet;
  strip.appendChild(rst);
}

function quickReps(r){
  const idx=activeSetIndex>=0?activeSetIndex:currentSets.length-1;
  if(idx<0){showToast('Добавьте подход','warning');return;}
  currentSets[idx].reps=r;
  renderSets();updateStats();updateProgress();
  // re-focus the reps input of that set after render
  setTimeout(()=>{
    const rows=document.querySelectorAll('.set-row');
    if(rows[idx]){
      const inp=rows[idx].querySelectorAll('input')[1];
      if(inp)inp.focus();
    }
  },50);
  showToast(`${r} повт. для подхода ${idx+1}`,'success');
}

// ─── Sets ─────────────────────────────────────────
function addSet(){
  const last=currentSets.length?currentSets[currentSets.length-1]:{reps:'',weight:''};
  currentSets.push({id:Date.now()+Math.random(),reps:'',weight:last.weight});
  renderSets();updateStats();updateProgress();
  // Focus weight input of the new last row
  setTimeout(()=>{
    const rows=document.querySelectorAll('.set-row');
    const last=rows[rows.length-1];
    if(last){const inp=last.querySelector('input');if(inp)inp.focus();}
  },40);
}

function removeSet(i){
  if(currentSets.length>1)currentSets.splice(i,1);
  else currentSets[0]={reps:'',weight:''};
  renderSets();updateStats();updateProgress();
  // Focus weight input of the row before the deleted one
  setTimeout(()=>{
    const rows=document.querySelectorAll('.set-row');
    const target=rows[Math.max(0,i-1)];
    if(target){const inp=target.querySelector('input');if(inp)inp.focus();}
  },40);
}

function cleanNum(v,max){
  let s=v.replace(/[^\d.]/g,'');
  const p=s.split('.');
  if(p.length>2)s=p[0]+'.'+p.slice(1).join('');
  if(s.includes('.')){const[a,b]=s.split('.');if(b.length>1)s=a+'.'+b[0];}
  if(s==='.')s='0.';
  if(max&&parseFloat(s)>max)s=String(max);
  return s;
}

function updateSet(i,field,val){
  if(field==='weight')val=cleanNum(val,1000);
  if(field==='reps') val=cleanNum(val,200);
  if(currentSets[i])currentSets[i][field]=val;
  updateStats();updateProgress();
}

function renderSets(){
  const c=document.getElementById('setsContainer');
  if(!c)return;
  c.innerHTML='';
  if(!currentSets.length){
    c.innerHTML='<div class="empty"><div class="empty-icon" style="font-size:40px;opacity:.2">—</div><div class="empty-title">Нет подходов</div></div>';
    renderQuickStrip();return;
  }
  currentSets.forEach((set,i)=>{
    const row=document.createElement('div');
    row.className='set-row';

    // set number
    const num=document.createElement('span');
    num.className='set-num';num.textContent=i+1;

    // inputs wrapper
    const inputs_wrap=document.createElement('div');
    inputs_wrap.className='set-inputs';

    // weight field
    const wf=document.createElement('div');wf.className='set-field';
    const wi=document.createElement('input');
    wi.type='text';wi.inputMode='decimal';wi.placeholder='вес';wi.value=set.weight||'';
    wi.pattern='[0-9]*[.]?[0-9]*';wi.dataset.idx=i;wi.dataset.field='weight';
    wi.addEventListener('input',()=>{
      updateSet(i,'weight',wi.value);
      // Auto-advance to reps after 2s of no new input
      clearTimeout(wi._autoAdv);
      if(wi.value.trim()){
        wi._autoAdv=setTimeout(()=>{
          // Only advance if reps is still empty
          if(!ri.value.trim())ri.focus();
        },2000);
      }
    });
    wi.addEventListener('focus',()=>{
      activeSetField='weight';activeSetIndex=i;renderQuickStrip();
      const strip=document.getElementById('qwStrip');if(strip)strip.scrollLeft=0;
    });
    const wu=document.createElement('div');wu.className='set-unit';wu.textContent='кг';
    wf.append(wi,wu);

    // reps field
    const rf=document.createElement('div');rf.className='set-field';
    const ri=document.createElement('input');
    ri.type='text';ri.inputMode='numeric';ri.placeholder='повт';ri.value=set.reps||'';
    ri.pattern='[0-9]*';ri.dataset.idx=i;ri.dataset.field='reps';
    ri.addEventListener('input',()=>{updateSet(i,'reps',ri.value)});
    ri.addEventListener('focus',()=>{
      activeSetField='reps';activeSetIndex=i;renderQuickStrip();
      const strip=document.getElementById('qwStrip');if(strip)strip.scrollLeft=0;
    });
    const ru=document.createElement('div');ru.className='set-unit';ru.textContent='раз';
    rf.append(ri,ru);

    inputs_wrap.append(wf,rf);

    // delete button
    const del=document.createElement('button');
    del.className='del-btn';del.title='Удалить';del.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
    del.addEventListener('click',()=>removeSet(i));

    row.append(num,inputs_wrap,del);
    c.appendChild(row);
  });

  const done=currentSets.filter(s=>s.reps&&s.weight).length;
  const total=currentSets.length;
  const dEl=document.getElementById('completedSets');
  const tEl=document.getElementById('totalSetsCount');
  if(dEl)dEl.textContent=done;
  if(tEl)tEl.textContent=total;
  renderQuickStrip();
}

function updateProgress(){
  const done=currentSets.filter(s=>s.reps&&s.weight).length;
  const total=currentSets.length;
  const pct=total?Math.round(done/total*100):0;
  const fill=document.getElementById('progFill');
  const lbl=document.getElementById('progLabel');
  if(fill)fill.style.width=pct+'%';
  if(lbl)lbl.textContent=pct+'%';
}

// ─── Stats bar ────────────────────────────────────
function updateStats(){
  const valid=currentSets.filter(s=>s.reps&&s.weight);
  const box=document.getElementById('workoutStats');
  if(!box)return;
  if(!valid.length){box.style.display='none';return;}
  box.style.display='grid';
  const vol=valid.reduce((sum,s)=>sum+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0),0);
  const best=valid.reduce((b,s)=>{const v=(parseFloat(s.weight)||0)*(parseInt(s.reps)||0);return v>b.v?{s,v}:b},{s:null,v:0});
  const avgW=valid.reduce((sum,s)=>sum+(parseFloat(s.weight)||0),0)/valid.length;
  const v=id=>document.getElementById(id);
  if(v('totalVolume'))v('totalVolume').textContent=Math.round(vol);
  if(v('totalSets'))  v('totalSets').textContent=valid.length;
  if(v('bestSet'))    v('bestSet').textContent=best.s?`${best.s.weight}×${best.s.reps}`:'—';
  if(v('avgWeight'))  v('avgWeight').textContent=Math.round(avgW);
}

// ─── Save workout ─────────────────────────────────
async function saveWorkout(){
  if(!Array.isArray(appData))appData=[];
  const name=document.getElementById('exerciseSelect').value;
  const valid=currentSets.filter(s=>s.reps&&s.weight);
  if(!name||name==='Выбрать упражнение...'){showToast('Выберите упражнение','error');return;}
  if(!valid.length){showToast('Заполните хотя бы один подход','error');return;}
  if(navigator.vibrate)navigator.vibrate(50);

  const btn=document.getElementById('saveBtn');
  const txt=document.getElementById('saveBtnText');
  const ldr=document.getElementById('saveBtnLoader');
  if(!btn)return;
  btn.disabled=true;
  if(txt)txt.innerHTML='<span style="opacity:.7">Сохранение...</span>';
  if(ldr)ldr.style.display='inline-block';

  await new Promise(r=>setTimeout(r,500));

  const rec={
    id: editingId||(Date.now()+'-'+Math.random().toString(36).substr(2,9)),
    name,
    sets:JSON.parse(JSON.stringify(valid)),
    date: editingId?(appData.find(x=>x.id===editingId)?.date||Date.now()):Date.now(),
    volume:valid.reduce((s,x)=>(parseFloat(x.weight)||0)*(parseInt(x.reps)||0)+s,0),
    userId:currentUser.id
  };

  if(editingId){
    const idx=appData.findIndex(x=>x.id===editingId);
    if(idx!==-1)appData[idx]=rec;else appData.push(rec);
    editingId=null;originalSetsBackup=null;
    if(txt)txt.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Сохранить тренировку`;
  }else{
    appData.push(rec);
  }

  saveData();
  currentSets=[];addSet();
  sessionStorage.removeItem(`currentSets_${currentUser.id}`);
  renderSets();renderHistory();updateStats();updateProgress();

  btn.disabled=false;
  if(txt)txt.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Сохранить тренировку`;
  if(ldr)ldr.style.display='none';
  showToast('Тренировка сохранена! 🎉','success');

  const hl=document.getElementById('historyList');
  if(hl)window.scrollTo({top:hl.offsetTop-80,behavior:'smooth'});
}

// ─── Render history ───────────────────────────────
function renderHistory(){
  const c=document.getElementById('historyList');
  if(!c)return;
  if(!Array.isArray(appData))appData=[];
  const flt=document.getElementById('filterExercise');
  const filter=flt?flt.value:'';

  if(!appData.length){
    c.innerHTML=`<div class="empty"><div class="empty-icon" style="font-size:40px;opacity:.2">—</div><div class="empty-title">История пуста</div><div class="empty-sub">Начните добавлять тренировки!</div></div>`;
    return;
  }

  let data=filter?appData.filter(x=>x.name===filter):appData;
  data=[...data].sort((a,b)=>b.date-a.date);

  if(!data.length){
    c.innerHTML=`<div class="empty"><div class="empty-icon" style="opacity:.25">—</div><div class="empty-title">Нет тренировок для фильтра</div></div>`;
    return;
  }

  c.innerHTML='';
  const grouped=data.reduce((g,item)=>{
    const d=new Date(item.date).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
    (g[d]=g[d]||[]).push(item);return g;
  },{});

  Object.entries(grouped).forEach(([date,items])=>{
    const grp=document.createElement('div');
    grp.className='hist-group';
    grp.innerHTML=`<div class="hist-date">${date} <span style="font-weight:500;color:var(--text-muted)">${items.length} ${plural(items.length,['тренировка','тренировки','тренировок'])}</span></div>`;

    items.forEach(item=>{
      if(!Array.isArray(item.sets))return;
      const vol=item.sets.reduce((s,x)=>(parseFloat(x.weight)||0)*(parseInt(x.reps)||0)+s,0);
      const tags=item.sets.map((s,i)=>`<span class="tag">${s.weight||0}×${s.reps||0}</span>`).join('');
      const el=document.createElement('div');
      el.className='hist-item';
      el.innerHTML=`
        <div class="hist-head">
          <div>
            <div class="hist-name">${item.name||'—'}</div>
            <div class="hist-meta">
              ${new Date(item.date).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
              · ${item.sets.length} ${plural(item.sets.length,['подход','подхода','подходов'])}
              · объём ${Math.round(vol)} кг
            </div>
          </div>
          <div class="hist-vol">${Math.round(vol)}<span style="font-size:14px;font-family:inherit"> кг</span></div>
        </div>
        <div class="tags">${tags}</div>`;
      if(editMode){
        const actDiv=document.createElement('div');
        actDiv.className='hist-actions';

        const editBtn=document.createElement('button');
        editBtn.className='ghost';
        editBtn.style.cssText='font-size:13px;padding:8px 14px;width:auto;display:flex;align-items:center;gap:6px';
        editBtn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'+' Изменить';
        editBtn.addEventListener('click',()=>editRec(item.id));

        const delBtn=document.createElement('button');
        delBtn.className='danger-ghost';
        delBtn.style.cssText='font-size:13px;padding:8px 14px;width:auto;display:flex;align-items:center;gap:6px';
        delBtn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>'+' Удалить';
        delBtn.addEventListener('click',()=>delRec(item.id));

        actDiv.append(editBtn,delBtn);
        el.appendChild(actDiv);
      }
      grp.appendChild(el);
    });
    c.appendChild(grp);
  });
}

function plural(n,f){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return f[2];if(n1>1&&n1<5)return f[1];if(n1===1)return f[0];return f[2];}

// ─── Hint ─────────────────────────────────────────
function loadLastSessionHint(){
  const name=document.getElementById('exerciseSelect').value;
  const hint=document.getElementById('lastSessionHint');
  if(!name||name==='Выбрать упражнение...'||!hint){if(hint)hint.style.display='none';return;}
  if(!Array.isArray(appData)){hint.style.display='none';return;}
  const last=[...appData.filter(x=>x.name===name)].sort((a,b)=>b.date-a.date)[0];
  if(!last||!Array.isArray(last.sets)||!last.sets.length){hint.style.display='none';return;}
  const best=last.sets.reduce((b,s)=>{const v=(parseFloat(s.weight)||0)*(parseInt(s.reps)||0);return v>b.v?{s,v}:b},{s:null,v:0});
  if(!best.s){hint.style.display='none';return;}
  const vol=last.sets.reduce((s,x)=>(parseFloat(x.weight)||0)*(parseInt(x.reps)||0)+s,0);
  const days=Math.floor((Date.now()-last.date)/86400000);
  const when=days===0?'сегодня':days===1?'вчера':`${days} дн. назад`;
  const ht=document.getElementById('hintText');
  if(ht)ht.innerHTML=`<span><b>${when}:</b> ${best.s.weight}кг×${best.s.reps} (лучший)</span><span style="color:var(--text-sub);font-size:11px">${last.sets.length} подхода · ${Math.round(vol)} кг</span>`;
  hint.style.display='flex';
}

function exportToCSV(){
  if(!appData.length){showToast('История пуста','warning');return;}
  try{
    let csv='data:text/csv;charset=utf-8,\uFEFF';
    csv+='Дата;Время;Упражнение;Подход;Вес (кг);Повторы;Объем\n';
    [...appData].sort((a,b)=>a.date-b.date).forEach(w=>{
      const d=new Date(w.date);
      const ds=d.toLocaleDateString('ru-RU');
      const ts=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
      w.sets.forEach((s,i)=>{
        const wt=parseFloat(s.weight)||0,rp=parseInt(s.reps)||0;
        csv+=`${ds};${ts};"${w.name}";${i+1};"${wt}";"${rp}";"${wt*rp}"\n`;
      });
    });
    const a=document.createElement('a');
    a.href=encodeURI(csv);
    a.download=`fittrack_${currentUser.name}_${new Date().toISOString().split('T')[0]}.csv`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    showToast('CSV экспортирован','success');
  }catch(e){showToast('Ошибка экспорта','error');}
}

function importFromCSV(ev){
  const file=ev.target.files[0];
  if(!file){showToast('Файл не выбран','warning');return;}
  if(!file.name.toLowerCase().endsWith('.csv')){showToast('Нужен CSV файл','error');ev.target.value='';return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const lines=e.target.result.split('\n');
      let imported=0;
      const wks=[];
      for(let i=1;i<lines.length;i++){
        const ln=lines[i].trim();if(!ln)continue;
        const v=ln.split(';').map(x=>x.trim().replace(/"/g,''));
        if(v.length<7)continue;
        const[ds,ts,en,,ws,rs]=v;
        if(!en)continue;
        let dt;
        try{
          if(ds.includes('.')){const[d,m,y]=ds.split('.');dt=new Date(y,m-1,d);if(ts){const[h,min]=ts.split(':');dt.setHours(+h||0,+min||0);}}
          else dt=new Date(ds+' '+ts);
        }catch{dt=new Date();}
        if(isNaN(dt))dt=new Date();
        const wt=parseFloat(ws.replace(',','.'))||0;
        const rp=parseInt(rs)||0;
        if(!wt||!rp||!en)continue;
        const xi=wks.findIndex(w=>w.name===en&&Math.abs(new Date(w.date)-dt)<86400000);
        if(xi>=0){wks[xi].sets.push({weight:wt,reps:rp});wks[xi].volume+=wt*rp;}
        else wks.push({id:Date.now()+'-'+Math.random().toString(36).substr(2,9)+'-'+i,name:en,sets:[{weight:wt,reps:rp}],date:dt.getTime(),volume:wt*rp,userId:currentUser.id});
        if(!exercises.includes(en))exercises.push(en);
        imported++;
      }
      if(wks.length){
        appData.push(...wks);saveExercises();saveData();
        renderExercises();renderHistory();
        showToast(`Импортировано ${imported} строк`,'success');
      }else showToast('Нет данных для импорта','warning');
    }catch(e){showToast('Ошибка импорта','error');}
    finally{ev.target.value='';}
  };
  reader.onerror=()=>{showToast('Ошибка чтения файла','error');ev.target.value='';};
  reader.readAsText(file,'UTF-8');
}

// ─── Parameters Chart (pure Canvas — no external deps) ────
function renderParametersChart(){
  const canvas=document.getElementById('parametersChart');
  if(!canvas)return;

  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth||300;
  const H=canvas.offsetHeight||220;
  canvas.width =W*dpr;
  canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const p=userParameters[currentUser.id]||{history:[]};
  const cut=Date.now()-chartPeriod*86400000;
  const hist=[...(p.history||[])].filter(e=>e.date>=cut).sort((a,b)=>a.date-b.date);

  // Clear
  ctx.clearRect(0,0,W,H);

  if(hist.length<2){
    ctx.fillStyle='#ADADAD';
    ctx.font=`${14*dpr}px system-ui,sans-serif`;
    ctx.setTransform(1,0,0,1,0,0); // reset scale for crisp pixel text
    ctx.fillStyle='#ADADAD';
    ctx.font='13px system-ui,sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('Недостаточно данных для графика', W*dpr/2, H*dpr/2);
    return;
  }

  const PAD={top:16,right:16,bottom:36,left:44};
  const cW=W-PAD.left-PAD.right;
  const cH=H-PAD.top-PAD.bottom;

  const weights=hist.map(e=>e.weight).filter(Boolean);
  const heights=hist.map(e=>e.height).filter(Boolean);

  // Helper: draw one dataset
  function drawLine(values,color,label){
    if(!values.length)return;
    const minV=Math.min(...values);
    const maxV=Math.max(...values);
    const range=maxV-minV||1;
    const n=hist.length;

    const pts=hist.map((e,i)=>{
      const v=e.weight!==undefined&&label==='Вес'?e.weight:e.height;
      if(!v)return null;
      const x=PAD.left+(i/(n-1))*cW;
      const y=PAD.top+cH-(((v-minV)/range)*cH*0.85+cH*0.075);
      return{x,y};
    }).filter(Boolean);

    if(pts.length<2)return;

    // Fill
    ctx.beginPath();
    ctx.moveTo(pts[0].x,PAD.top+cH);
    pts.forEach(pt=>ctx.lineTo(pt.x,pt.y));
    ctx.lineTo(pts[pts.length-1].x,PAD.top+cH);
    ctx.closePath();
    ctx.fillStyle=color.replace('1)','0.08)');
    ctx.fill();

    // Line
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++){
      const cp={x:(pts[i-1].x+pts[i].x)/2,y:(pts[i-1].y+pts[i].y)/2};
      ctx.quadraticCurveTo(pts[i-1].x,pts[i-1].y,cp.x,cp.y);
    }
    ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);
    ctx.strokeStyle=color;
    ctx.lineWidth=2;
    ctx.stroke();

    // Dots
    pts.forEach(pt=>{
      ctx.beginPath();
      ctx.arc(pt.x,pt.y,3.5,0,Math.PI*2);
      ctx.fillStyle=color;
      ctx.fill();
    });
  }

  // Grid lines
  ctx.strokeStyle='rgba(0,0,0,.05)';
  ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=PAD.top+(cH/4)*i;
    ctx.beginPath();ctx.moveTo(PAD.left,y);ctx.lineTo(W-PAD.right,y);ctx.stroke();
  }

  // X axis labels
  ctx.fillStyle='#ADADAD';
  ctx.font='10px system-ui,sans-serif';
  ctx.textAlign='center';
  const labelStep=Math.max(1,Math.floor(hist.length/5));
  hist.forEach((e,i)=>{
    if(i%labelStep!==0&&i!==hist.length-1)return;
    const x=PAD.left+(i/(hist.length-1))*cW;
    const d=new Date(e.date);
    const lbl=d.getDate()+'.'+(d.getMonth()+1);
    ctx.fillText(lbl,x,H-6);
  });

  // Draw datasets
  drawLine(weights,'rgba(230,0,35,1)','Вес');
  drawLine(heights,'rgba(0,164,0,1)','Рост');

  // Legend
  const legends=[{c:'rgba(230,0,35,1)',t:'Вес кг'},{c:'rgba(0,164,0,1)',t:'Рост см'}];
  ctx.font='11px system-ui,sans-serif';
  let lx=PAD.left;
  legends.forEach(lg=>{
    ctx.fillStyle=lg.c;
    ctx.fillRect(lx,4,12,4);
    ctx.fillStyle='#ADADAD';
    ctx.textAlign='left';
    ctx.fillText(lg.t,lx+16,10);
    lx+=60;
  });
}

// ─── Comparison ───────────────────────────────────
function openUsersComparison(){renderUsersComparison();document.getElementById('comparisonModal').classList.add('active');}
function closeUsersComparison(){document.getElementById('comparisonModal').classList.remove('active');}

function loadUserData(uid){
  try{const s=localStorage.getItem(`${SK}_${uid}`);const d=s?JSON.parse(s):[];return Array.isArray(d)?d:[];}
  catch(e){return [];}
}

function renderUsersComparison(){
  const c=document.getElementById('comparisonContent');
  const ex=(document.getElementById('comparisonExercise')||{}).value||'';
  if(!c)return;
  if(users.length<2){c.innerHTML='<div class="empty"><div class="empty-title">Нужно ≥2 пользователей</div></div>';return;}
  const stats=users.map(u=>{
    const d=loadUserData(u.id);
    const fd=ex?d.filter(x=>x.name===ex):d;
    const p=userParameters[u.id]||{};
    const vol=fd.reduce((s,w)=>s+(w.volume||0),0);
    let mx=0;fd.forEach(w=>w.sets.forEach(s=>{const wt=parseFloat(s.weight)||0;if(wt>mx)mx=wt;}));
    const bmi=p.height&&p.weight?(p.weight/((p.height/100)**2)).toFixed(1):'-';
    const last=fd.length?new Date(Math.max(...fd.map(w=>w.date))).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}):'-';
    return{id:u.id,name:u.name,height:p.height,weight:p.weight,bmi,wks:fd.length,sets:fd.reduce((s,w)=>s+w.sets.length,0),vol,avgVol:fd.length?Math.round(vol/fd.length):0,mx,last};
  }).sort((a,b)=>b.vol-a.vol);

  let html=`<div style="overflow-x:auto"><table class="cmp-table">
    <thead><tr><th>Пользователь</th><th>Рост/Вес</th><th>Тренировок</th><th>Объём</th><th>Рекорд</th></tr></thead>
    <tbody>`;
  stats.forEach(s=>{
    const cur=s.id===currentUser.id;
    html+=`<tr style="${cur?'background:rgba(230,0,35,.04)':''}">
      <td>
        <div style="font-weight:${cur?700:500};color:${cur?'var(--primary)':'var(--text)'}">${s.name}</div>
        <div style="font-size:11px;color:var(--text-sub)">${s.last}</div>
      </td>
      <td>
        <div>${s.height?s.height+' см':'—'}</div>
        <div style="font-size:11px;color:var(--text-sub)">${s.weight?s.weight+' кг':'—'}</div>
        <div style="font-size:10px;color:var(--${s.bmi!=='-'?(s.bmi<18.5||s.bmi>=25?'warning':'success'):'text-sub'})">${s.bmi!=='-'?'ИМТ '+s.bmi:''}</div>
      </td>
      <td class="cmp-val">${s.wks}</td>
      <td class="cmp-val"><div>${Math.round(s.vol)} кг</div><div style="font-size:10px;color:var(--text-sub)">${s.avgVol} кг/тр.</div></td>
      <td class="cmp-val">${Math.round(s.mx)} кг</td>
    </tr>`;
  });
  html+=`</tbody></table></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px">
    ${[['','Пользователей',stats.length],['','Тренировок',stats.reduce((s,x)=>s+x.wks,0)],['','Общий объём кг',Math.round(stats.reduce((s,x)=>s+x.vol,0))],['','Рекорд кг',Math.round(Math.max(...stats.map(s=>s.mx)))]].map(([ic,l,v])=>`
      <div class="pstat">
        <div style="font-size:24px;margin-bottom:4px">${ic}</div>
        <div class="pstat-val" style="font-size:24px">${v}</div>
        <div class="pstat-lbl">${l}</div>
      </div>`).join('')}
  </div>`;
  c.innerHTML=html;
}

// ─── Tabs ─────────────────────────────────────────
// BUG FIX: original switchTab didn't receive the clicked button ref, causing querySelector to fail
function switchTab(id,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.tab-pane').forEach(t=>t.classList.remove('on'));
  if(btn)btn.classList.add('on');
  const p=document.getElementById(id);
  if(p)p.classList.add('on');
}

// ─── Toast ────────────────────────────────────────
function showToast(msg,type='info'){
  const t=document.getElementById('toast');if(!t)return;
  const icons={success:'✓',error:'✕',warning:'!',info:'i'};
  t.innerHTML=`${icons[type]||'ℹ️'} ${msg}`;
  t.className=`toast ${type} show`;
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>{t.classList.remove('show');},3000);
}

// ─── Event delegation ─────────────────────────────
document.addEventListener('click',e=>{
  if(e.target.classList.contains('modal'))e.target.classList.remove('active');
});

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveWorkout();}
  if(e.key==='Escape'){
    document.querySelectorAll('.modal.active').forEach(m=>m.classList.remove('active'));
    closeMenu();
  }
});

// ─── Dropdown menu ────────────────────────────────
function toggleMenu(){
  const dd=document.getElementById('menuDropdown');
  const btn=document.getElementById('menuBtn');
  if(!dd)return;
  const open=dd.classList.toggle('open');
  if(btn)btn.classList.toggle('on',open);
}
function closeMenu(){
  const dd=document.getElementById('menuDropdown');
  const btn=document.getElementById('menuBtn');
  if(dd)dd.classList.remove('open');
  if(btn)btn.classList.remove('on');
}
document.addEventListener('click',e=>{
  const wrap=document.querySelector('.menu-wrap');
  if(wrap&&!wrap.contains(e.target))closeMenu();
});

// ─── Edit mode menu item label ─────────────────────
function updateEditModeLabel(){
  const item=document.getElementById('editModeItem');
  if(item){
    const pencilSvg=item.querySelector('svg');
    item.textContent=(editMode?'Выйти из редактирования':'Редактирование');
    if(pencilSvg)item.prepend(pencilSvg);
  }
}
